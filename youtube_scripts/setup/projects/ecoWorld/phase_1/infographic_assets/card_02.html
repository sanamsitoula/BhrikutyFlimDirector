<!-- EXPORT comment -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>Eco World Infographic Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2D7D46;
            --secondary-color: #F5A623;
            --neutral-color: #8B9BB4;
            --background-color: #0F1A14;
            --highlight-color: #3B82F6;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--background-color); /* Fallback for body */
        }

        .card-container {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background-color: transparent; /* Actual background will be animated */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* --- Background Animation --- */
        .card-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--background-color);
            opacity: 0;
            animation: fadeInBg 0.5s forwards;
        }

        @keyframes fadeInBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- Logo & Phase Label --- */
        .logo-area {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%) translateY(-100%); /* Start above screen */
            opacity: 0;
            text-align: center;
            animation: slideDownLogo 0.6s ease-out forwards 0.5s; /* Delay after bg fade */
            z-index: 10;
        }

        .phase-label {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            color: var(--neutral-color);
            margin-bottom: 10px;
            white-space: nowrap;
        }

        .eco-world-logo svg {
            width: 250px; /* Scale SVG container */
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .eco-world-logo svg text {
            fill: var(--primary-color); /* Set logo color from brand guidelines */
            font-family: 'Space Grotesk', sans-serif; /* Ensure correct font for SVG text */
            font-size: 36px; /* Font size within SVG's viewBox */
            font-weight: 700;
        }

        @keyframes slideDownLogo {
            from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* --- Headline Animation --- */
        .headline-container {
            position: absolute;
            top: 400px; /* Position below logo */
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 82px;
            color: var(--secondary-color);
            line-height: 1.2;
            white-space: nowrap; /* Keep words on one line */
            z-index: 5;
        }

        .headline-word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: wordIn 0.4s ease-out forwards;
        }

        @keyframes wordIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* --- Sub-Header/Content Animation --- */
        .sub-header-content {
            position: absolute;
            top: 570px; /* Position below headline */
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 58px;
            color: var(--neutral-color);
            width: 90%; /* Constrain width */
            line-height: 1.3;
            opacity: 0;
            transform: translateY(100%); /* Start below screen */
            animation: slideUpContent 0.6s ease-out forwards 2.2s; /* Delay after headline */
            z-index: 4;
        }

        @keyframes slideUpContent {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* --- CTA Strip Animation --- */
        .cta-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px; /* Height of the strip */
            background-color: var(--highlight-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            font-size: 48px;
            color: var(--background-color);
            font-weight: 700;
            transform: translateY(100%); /* Start below screen */
            opacity: 0; /* Also fade in with bounce */
            animation: bounceCta 0.8s ease-in-out forwards 2.8s; /* Delay after content */
            z-index: 15;
        }

        @keyframes bounceCta {
            0% { transform: translateY(100%); opacity: 0; }
            40% { transform: translateY(-5%); opacity: 1; }
            60% { transform: translateY(0%); }
            80% { transform: translateY(-2%); }
            100% { transform: translateY(0%); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card-background"></div>

        <div class="logo-area">
            <div class="phase-label">Phase: 1 Card: 2</div>
            <div class="eco-world-logo">
                <svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="200" height="60" fill="transparent"/>
                    <text x="100" y="30" dominant-baseline="middle" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="#2D7D46">
                        Eco World
                    </text>
                </svg>
            </div>
        </div>

        <div class="headline-container">
            <span class="headline-word" style="animation-delay: 1.2s;">Why</span>
            <span class="headline-word" style="animation-delay: 1.4s;">Prices</span>
            <span class="headline-word" style="animation-delay: 1.6s;">Change?</span>
        </div>

        <div class="sub-header-content">
            Microeconomics Explained
        </div>

        <div class="cta-strip">
            Learn More on YouTube
        </div>
    </div>
</body>
</html>

<!-- EXPORT: Instagram Post 1080x1080px · YouTube Thumbnail 1280x720px -->
<!-- CARD 01 — THE SMART CONTRACT: IF THIS, THEN THAT -->
<!-- Chain Clarity · Phase 3 · Agent 12 — Infographic Asset Generator -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Card 01 — Smart Contract IF/THEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:   #00D4AA;
      --gold:   #F5A623;
      --slate:  #8B9BB4;
      --navy:   #0A0E1A;
      --violet: #7B5CF0;
      --white:  #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1080px;
      background: var(--navy); overflow: hidden;
      font-family: 'Space Grotesk', sans-serif; position: relative;
    }

    /* ── BACKGROUND ── */
    .bg-radial {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(123,92,240,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 90%, rgba(0,212,170,0.05) 0%, transparent 60%);
      opacity: 0; animation: fadeIn 0.2s ease forwards;
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeIn    { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-28px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes slideUp   { from { opacity: 0; transform: translateY(32px)  } to { opacity: 1; transform: translateY(0) } }
    @keyframes wordIn    { from { opacity: 0; transform: translateY(12px)  } to { opacity: 1; transform: translateY(0) } }
    @keyframes bounce    { 0% { opacity: 0; transform: scale(0.8) translateY(16px) } 70% { transform: scale(1.04) translateY(-3px) } 100% { opacity: 1; transform: scale(1) translateY(0) } }
    @keyframes arrowIn   { from { opacity: 0; transform: scaleY(0) } to { opacity: 1; transform: scaleY(1) } }

    /* ── LOGO ── */
    .logo-wrap {
      position: absolute; top: 52px; left: 60px;
      display: flex; align-items: center; gap: 14px;
      opacity: 0; animation: slideDown 0.3s ease forwards 0.2s;
    }
    .logo-text { font-size: 22px; font-weight: 600; color: var(--white); letter-spacing: -0.3px; }
    .logo-text span { color: var(--teal); }

    /* ── HEADLINE ── */
    .headline-block { position: absolute; top: 148px; left: 60px; right: 60px; }
    .headline {
      font-size: 72px; font-weight: 700; color: var(--white);
      letter-spacing: -2px; line-height: 1;
      display: flex; gap: 16px;
    }
    .headline .word { opacity: 0; animation: wordIn 0.25s ease forwards; }
    .headline .word:nth-child(1) { animation-delay: 0.5s; }
    .headline .word:nth-child(2) { animation-delay: 0.58s; }
    .headline .word:nth-child(3) { animation-delay: 0.66s; }
    .sub-headline {
      font-size: 72px; font-weight: 700; color: var(--violet);
      letter-spacing: -2px; line-height: 1; margin-top: 6px;
      display: flex; gap: 16px;
    }
    .sub-headline .word { opacity: 0; animation: wordIn 0.25s ease forwards; }
    .sub-headline .word:nth-child(1) { animation-delay: 0.74s; }
    .sub-headline .word:nth-child(2) { animation-delay: 0.82s; }
    .sub-headline .word:nth-child(3) { animation-delay: 0.90s; }
    .sub-headline .word:nth-child(4) { animation-delay: 0.98s; }
    .divider {
      width: 100%; height: 1px; background: rgba(139,155,180,0.25);
      margin-top: 22px; opacity: 0; animation: fadeIn 0.3s ease forwards 1.1s;
    }

    /* ── LOGIC FLOW ── */
    .flow { position: absolute; top: 368px; left: 60px; right: 60px; }

    .flow-row {
      border-radius: 12px; padding: 18px 28px;
      display: flex; align-items: center; gap: 18px;
      opacity: 0;
    }
    .badge {
      font-size: 28px; font-weight: 700; letter-spacing: 1px;
      padding: 6px 16px; border-radius: 6px; flex-shrink: 0;
    }
    .badge-if   { background: var(--gold);   color: var(--navy); }
    .badge-then-teal   { background: var(--teal);   color: var(--navy); }
    .badge-then-violet { background: var(--violet); color: var(--white); }
    .row-text { font-size: 30px; font-weight: 500; color: var(--white); line-height: 1.3; }

    .row-if-1 { border: 1.5px solid var(--gold); background: rgba(245,166,35,0.06);
      animation: slideUp 0.4s ease forwards 1.2s; }
    .arrow-1 {
      display: flex; justify-content: center; align-items: center;
      height: 32px; font-size: 28px; color: var(--teal);
      opacity: 0; animation: fadeIn 0.3s ease forwards 1.6s;
    }
    .row-then-1 { border: 1.5px solid var(--teal); background: rgba(0,212,170,0.06);
      animation: slideUp 0.4s ease forwards 1.7s; }
    .arrow-2 {
      display: flex; justify-content: center; align-items: center;
      height: 32px; font-size: 28px; color: var(--teal);
      opacity: 0; animation: fadeIn 0.3s ease forwards 2.1s;
    }
    .row-if-2 { border: 1.5px solid var(--gold); background: rgba(245,166,35,0.06);
      animation: slideUp 0.4s ease forwards 2.2s; }
    .arrow-3 {
      display: flex; justify-content: center; align-items: center;
      height: 32px; font-size: 28px; color: var(--violet);
      opacity: 0; animation: fadeIn 0.3s ease forwards 2.6s;
    }
    .row-then-2 { border: 1.5px solid var(--violet); background: rgba(123,92,240,0.06);
      animation: slideUp 0.4s ease forwards 2.7s; }

    /* ── CALLOUT ── */
    .callout {
      position: absolute; bottom: 96px; left: 60px; right: 60px;
      background: rgba(123,92,240,0.10); border: 1px solid rgba(123,92,240,0.35);
      border-radius: 10px; padding: 22px 36px; text-align: center;
      font-size: 34px; font-weight: 700; color: var(--violet); letter-spacing: -0.3px;
      opacity: 0; animation: bounce 0.3s ease forwards 3.1s;
    }

    /* ── WORDMARK ── */
    .wordmark {
      position: absolute; bottom: 44px; right: 60px;
      font-size: 26px; font-weight: 600; color: rgba(139,155,180,0.5); letter-spacing: -0.3px;
      opacity: 0; animation: fadeIn 0.4s ease forwards 3.3s;
    }
    .wordmark span { color: rgba(0,212,170,0.6); }
  </style>
</head>
<body>

  <div class="bg-radial"></div>

  <!-- Logo -->
  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 62" width="48" height="41">
      <polygon points="42,30 32,47 12,47 2,30 12,13 32,13" fill="#00D4AA"/>
      <polygon points="68,30 58,47 38,47 28,30 38,13 58,13" fill="#0A0E1A" stroke="#7B5CF0" stroke-width="2.5"/>
      <polygon points="35,18 42,30 35,42 28,30" fill="#F5A623"/>
    </svg>
    <span class="logo-text">Chain<span>Clarity</span></span>
  </div>

  <!-- Headline -->
  <div class="headline-block">
    <div class="headline">
      <span class="word">THE</span><span class="word">SMART</span><span class="word">CONTRACT</span>
    </div>
    <div class="sub-headline">
      <span class="word">IF</span><span class="word">THIS,</span><span class="word">THEN</span><span class="word">THAT</span>
    </div>
    <div class="divider"></div>
  </div>

  <!-- IF/THEN Flow -->
  <div class="flow">
    <div class="flow-row row-if-1">
      <span class="badge badge-if">IF</span>
      <span class="row-text">Deposit 150 USD of ETH as collateral</span>
    </div>
    <div class="arrow-1">↓</div>
    <div class="flow-row row-then-1">
      <span class="badge badge-then-teal">THEN</span>
      <span class="row-text">Release 100 USD stablecoin loan</span>
    </div>
    <div class="arrow-2">↓</div>
    <div class="flow-row row-if-2">
      <span class="badge badge-if">IF</span>
      <span class="row-text">Collateral drops below 120 USD</span>
    </div>
    <div class="arrow-3">↓</div>
    <div class="flow-row row-then-2">
      <span class="badge badge-then-violet">THEN</span>
      <span class="row-text">Auto-liquidate. Loan repaid.</span>
    </div>
  </div>

  <!-- Callout -->
  <div class="callout">NO HUMAN APPROVES. CODE IS THE BANK.</div>

  <!-- Wordmark -->
  <div class="wordmark">Chain<span>Clarity</span></div>

</body>
</html>

<!-- EXPORT: Instagram Post 1080x1080px — set browser viewport to 1080x1080 before recording -->
<!-- EXPORT: YouTube Thumbnail 1280x720px — set viewport to 1280x720 and scale fonts 85% -->
<!-- Chain Clarity · Phase 1 · Card 03 · THE CHAIN LINK -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Chain Clarity — The Chain Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:   #00D4AA;
      --gold:   #F5A623;
      --slate:  #8B9BB4;
      --navy:   #0A0E1A;
      --violet: #7B5CF0;
      --white:  #FFFFFF;
    }
    * { box-sizing:border-box; margin:0; padding:0; }

    @keyframes fadeIn   { from{opacity:0}                              to{opacity:1} }
    @keyframes slideDown{ from{transform:translateY(-28px);opacity:0}  to{transform:translateY(0);opacity:1} }
    @keyframes slideUp  { from{transform:translateY(40px);opacity:0}   to{transform:translateY(0);opacity:1} }
    @keyframes slideLeft{ from{transform:translateX(-40px);opacity:0}  to{transform:translateX(0);opacity:1} }
    @keyframes bounce   { 0%{transform:scale(0.6) translateY(16px);opacity:0} 60%{transform:scale(1.06) translateY(-3px)} 100%{transform:scale(1) translateY(0);opacity:1} }
    @keyframes wordIn   { from{opacity:0;transform:translateY(8px)}    to{opacity:1;transform:translateY(0)} }
    @keyframes drawArrow{ from{stroke-dashoffset:120} to{stroke-dashoffset:0} }

    body {
      width:1080px; height:1080px;
      background:var(--navy); overflow:hidden;
      font-family:'Inter',sans-serif;
    }
    .bg {
      position:absolute; inset:0;
      background: radial-gradient(ellipse at 50% 60%, rgba(0,212,170,0.05) 0%, transparent 60%),
                  var(--navy);
      animation:fadeIn 0.2s ease-out forwards;
    }
    .card {
      position:relative; width:1080px; height:1080px;
      display:flex; flex-direction:column;
      padding:72px 80px;
    }

    /* Logo */
    .logo {
      display:flex; align-items:center; gap:16px;
      opacity:0; animation:slideDown 0.3s ease-out 0.3s forwards;
    }
    .logo-text .name { font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; color:var(--white); }
    .logo-text .name span { font-weight:300; color:var(--teal); }
    .logo-text .tag  { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--slate); margin-top:3px; }

    /* Headline */
    .headline {
      font-family:'Space Grotesk',sans-serif;
      font-size:96px; font-weight:700; color:var(--teal);
      line-height:1; letter-spacing:-2px; margin-top:44px;
    }
    .word { display:inline-block; opacity:0; animation:wordIn 0.15s ease-out forwards; }
    .word:nth-child(1){ animation-delay:0.6s; }
    .word:nth-child(2){ animation-delay:0.76s; }
    .word:nth-child(3){ animation-delay:0.92s; }

    /* Chain diagram container */
    .chain-area {
      display:flex; align-items:center; gap:0;
      margin-top:52px; flex:1;
    }

    /* Block card */
    .blk {
      flex:1;
      background:rgba(0,212,170,0.04);
      border:2px solid var(--teal);
      border-radius:16px;
      padding:28px 24px;
      opacity:0;
    }
    .blk.b1 { animation:slideLeft 0.4s ease-out 1.4s forwards; }
    .blk.b2 { animation:slideLeft 0.4s ease-out 1.7s forwards; }
    .blk.b3 { animation:slideLeft 0.4s ease-out 2.0s forwards; }

    .blk-label {
      font-family:'Space Grotesk',sans-serif;
      font-size:28px; font-weight:700; color:var(--slate);
      letter-spacing:2px; text-transform:uppercase;
      margin-bottom:16px;
    }
    .blk-row {
      font-family:'Inter',sans-serif;
      font-size:24px; color:var(--slate);
      padding:8px 0; border-bottom:1px solid rgba(139,155,180,0.12);
    }
    .blk-row:last-child { border-bottom:none; }
    .blk-row .key { color:var(--slate); }
    .blk-row .val { color:var(--white); }
    .blk-row.hash-row .val {
      font-family:'JetBrains Mono',monospace;
      font-size:20px; color:var(--gold);
    }

    /* Arrow connector */
    .arrow-wrap {
      display:flex; align-items:center; justify-content:center;
      width:60px; flex-shrink:0;
      opacity:0;
    }
    .arrow-wrap.a1 { animation:fadeIn 0.3s ease-out 1.6s forwards; }
    .arrow-wrap.a2 { animation:fadeIn 0.3s ease-out 1.9s forwards; }
    .arrow-wrap svg { overflow:visible; }

    /* Prev-hash callout label */
    .prev-label {
      position:absolute; left:50%; top:calc(72px + 44px + 96px + 52px + 48px);
      transform:translateX(-50%);
      font-family:'JetBrains Mono',monospace;
      font-size:20px; color:var(--violet);
      letter-spacing:1px;
      opacity:0; animation:fadeIn 0.4s ease-out 2.2s forwards;
      white-space:nowrap;
    }

    /* Callout strip */
    .callout {
      margin-top:auto; padding-top:28px;
      padding:28px 36px;
      background:rgba(123,92,240,0.08);
      border:1px solid rgba(123,92,240,0.28);
      border-radius:14px;
      opacity:0; animation:bounce 0.35s ease-out 2.5s forwards;
    }
    .callout-text {
      font-family:'Space Grotesk',sans-serif;
      font-size:48px; font-weight:700; color:var(--violet);
      line-height:1.1;
    }
    .callout-sub {
      font-family:'Inter',sans-serif;
      font-size:28px; color:var(--slate); margin-top:8px;
    }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="card">

  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 62" width="52" height="45">
      <polygon points="42,30 32,47 12,47 2,30 12,13 32,13" fill="#00D4AA"/>
      <polygon points="68,30 58,47 38,47 28,30 38,13 58,13" fill="#0A0E1A" stroke="#7B5CF0" stroke-width="2.5"/>
      <polygon points="35,18 42,30 35,42 28,30" fill="#F5A623"/>
    </svg>
    <div class="logo-text">
      <div class="name">Chain <span>Clarity</span></div>
      <div class="tag">Blockchain without the noise</div>
    </div>
  </div>

  <div class="headline">
    <span class="word">THE&nbsp;</span><span class="word">CHAIN&nbsp;</span><span class="word">LINK</span>
  </div>

  <div class="chain-area">

    <!-- Block 99 -->
    <div class="blk b1">
      <div class="blk-label">Block 99</div>
      <div class="blk-row"><span class="key">data</span></div>
      <div class="blk-row"><span class="key">time</span></div>
      <div class="blk-row hash-row">
        <span class="key">prev: </span><span class="val">0000...abc</span>
      </div>
      <div class="blk-row hash-row">
        <span class="key">hash: </span><span class="val">1a2b...xyz</span>
      </div>
    </div>

    <!-- Arrow 1 -->
    <div class="arrow-wrap a1">
      <svg width="60" height="32" viewBox="0 0 60 32">
        <line x1="4" y1="16" x2="48" y2="16" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="120" stroke-dashoffset="0"/>
        <polygon points="48,10 60,16 48,22" fill="#F5A623"/>
      </svg>
    </div>

    <!-- Block 100 -->
    <div class="blk b2">
      <div class="blk-label">Block 100</div>
      <div class="blk-row"><span class="key">data</span></div>
      <div class="blk-row"><span class="key">time</span></div>
      <div class="blk-row hash-row">
        <span class="key">prev: </span><span class="val">1a2b...xyz</span>
      </div>
      <div class="blk-row hash-row">
        <span class="key">hash: </span><span class="val">3c4d...mno</span>
      </div>
    </div>

    <!-- Arrow 2 -->
    <div class="arrow-wrap a2">
      <svg width="60" height="32" viewBox="0 0 60 32">
        <line x1="4" y1="16" x2="48" y2="16" stroke="#F5A623" stroke-width="2.5"/>
        <polygon points="48,10 60,16 48,22" fill="#F5A623"/>
      </svg>
    </div>

    <!-- Block 101 -->
    <div class="blk b3">
      <div class="blk-label">Block 101</div>
      <div class="blk-row"><span class="key">data</span></div>
      <div class="blk-row"><span class="key">time</span></div>
      <div class="blk-row hash-row">
        <span class="key">prev: </span><span class="val">3c4d...mno</span>
      </div>
      <div class="blk-row hash-row">
        <span class="key">hash: </span><span class="val">5e6f...pqr</span>
      </div>
    </div>

  </div>

  <!-- Callout -->
  <div class="callout">
    <div class="callout-text">PREV_HASH IS THE CHAIN</div>
    <div class="callout-sub">Change Block 99 → Block 100 breaks.</div>
  </div>

</div>
</body>
</html>

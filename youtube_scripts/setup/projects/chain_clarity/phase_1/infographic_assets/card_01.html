<!-- EXPORT: Instagram Post 1080x1080px — set browser viewport to 1080x1080 before recording -->
<!-- EXPORT: YouTube Thumbnail 1280x720px — set viewport to 1280x720 and adjust font-size to 85% -->
<!-- Chain Clarity · Phase 1 · Card 01 · WHAT IS A BLOCK? -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Chain Clarity — What Is a Block?</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:    #00D4AA;
      --gold:    #F5A623;
      --slate:   #8B9BB4;
      --navy:    #0A0E1A;
      --violet:  #7B5CF0;
      --white:   #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1080px;
      background: var(--navy);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* ── Global animation keyframes ── */
    @keyframes fadeIn   { from { opacity: 0; }                       to { opacity: 1; } }
    @keyframes slideDown{ from { transform: translateY(-28px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideUp  { from { transform: translateY(40px);  opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes bounce   { 0%{transform:scale(0.6) translateY(20px);opacity:0} 60%{transform:scale(1.08) translateY(-4px)} 100%{transform:scale(1) translateY(0);opacity:1} }
    @keyframes wordIn   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drawHex  { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }

    /* ── Background ── */
    .bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(0,212,170,0.06) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 70%, rgba(123,92,240,0.05) 0%, transparent 50%),
                  var(--navy);
      animation: fadeIn 0.2s ease-out forwards;
    }

    /* ── Layout ── */
    .card {
      position: relative;
      width: 1080px; height: 1080px;
      display: flex;
      flex-direction: column;
      padding: 72px 80px;
    }

    /* ── Logo mark ── */
    .logo {
      display: flex; align-items: center; gap: 16px;
      opacity: 0;
      animation: slideDown 0.3s ease-out 0.3s forwards;
    }
    .logo-text { font-family: 'Space Grotesk', sans-serif; }
    .logo-text .name  { font-size: 24px; font-weight: 700; color: var(--white); line-height: 1; }
    .logo-text .name span { font-weight: 300; color: var(--teal); }
    .logo-text .tag   { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--slate); margin-top: 3px; }

    /* ── Headline ── */
    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 96px;
      font-weight: 700;
      color: var(--teal);
      line-height: 1;
      letter-spacing: -2px;
      margin-top: 52px;
    }
    .headline .word {
      display: inline-block;
      opacity: 0;
      animation: wordIn 0.15s ease-out forwards;
    }
    .headline .word:nth-child(1) { animation-delay: 0.6s; }
    .headline .word:nth-child(2) { animation-delay: 0.76s; }
    .headline .word:nth-child(3) { animation-delay: 0.92s; }
    .headline .word:nth-child(4) { animation-delay: 1.08s; }

    /* ── Sub-deck ── */
    .subdeck {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      color: var(--slate);
      margin-top: 16px;
      opacity: 0;
      animation: slideUp 0.4s ease-out 1.4s forwards;
    }

    /* ── Block diagram ── */
    .block-diagram {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-top: 52px;
      flex: 1;
      opacity: 0;
      animation: slideUp 0.4s ease-out 1.6s forwards;
    }

    .block-left {
      width: 6px;
      background: var(--teal);
      border-radius: 4px;
      margin-right: 32px;
      flex-shrink: 0;
    }

    .block-rows { display: flex; flex-direction: column; gap: 28px; flex: 1; }

    .block-row {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 28px 36px;
      background: rgba(0,212,170,0.04);
      border: 1px solid rgba(0,212,170,0.12);
      border-radius: 16px;
      opacity: 0;
    }
    .block-row:nth-child(1) { animation: slideUp 0.4s ease-out 1.8s forwards; }
    .block-row:nth-child(2) { animation: slideUp 0.4s ease-out 1.95s forwards; }
    .block-row:nth-child(3) { animation: slideUp 0.4s ease-out 2.1s forwards; }

    .row-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px;
      font-weight: 700;
      color: var(--gold);
      width: 64px;
      flex-shrink: 0;
      line-height: 1;
    }
    .row-info { flex: 1; }
    .row-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.1;
    }
    .row-desc {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      color: var(--slate);
      margin-top: 4px;
    }

    /* ── Stat ── */
    .stat-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 32px;
      padding: 24px 36px;
      background: rgba(245,166,35,0.06);
      border: 1px solid rgba(245,166,35,0.18);
      border-radius: 12px;
      opacity: 0;
      animation: bounce 0.3s ease-out 2.4s forwards;
    }
    .stat-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px;
      font-weight: 700;
      color: var(--gold);
    }
    .stat-label {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      color: var(--slate);
    }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="card">

  <!-- Logo -->
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 62" width="52" height="45">
      <polygon points="42,30 32,47 12,47 2,30 12,13 32,13" fill="#00D4AA"/>
      <polygon points="68,30 58,47 38,47 28,30 38,13 58,13" fill="#0A0E1A" stroke="#7B5CF0" stroke-width="2.5"/>
      <polygon points="35,18 42,30 35,42 28,30" fill="#F5A623"/>
    </svg>
    <div class="logo-text">
      <div class="name">Chain <span>Clarity</span></div>
      <div class="tag">Blockchain without the noise</div>
    </div>
  </div>

  <!-- Headline -->
  <div class="headline">
    <span class="word">WHAT&nbsp;</span><span class="word">IS&nbsp;</span><span class="word">A&nbsp;</span><span class="word">BLOCK?</span>
  </div>

  <!-- Subdeck -->
  <div class="subdeck">One sealed ledger page. Three critical parts.</div>

  <!-- Block diagram -->
  <div class="block-diagram">
    <div class="block-left"></div>
    <div class="block-rows">

      <div class="block-row">
        <div class="row-num">①</div>
        <div class="row-info">
          <div class="row-title">DATA</div>
          <div class="row-desc">Transaction records inside</div>
        </div>
      </div>

      <div class="block-row">
        <div class="row-num">②</div>
        <div class="row-info">
          <div class="row-title">TIMESTAMP</div>
          <div class="row-desc">Exact sealing moment</div>
        </div>
      </div>

      <div class="block-row">
        <div class="row-num">③</div>
        <div class="row-info">
          <div class="row-title">HASH</div>
          <div class="row-desc">A digital fingerprint</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Stat -->
  <div class="stat-bar">
    <div class="stat-num" id="statNum">~2,000</div>
    <div class="stat-label">transactions per Bitcoin block</div>
  </div>

</div>

<script>
  // Stat counter animation
  setTimeout(() => {
    const el = document.getElementById('statNum');
    let count = 0;
    const target = 2000;
    const duration = 1000;
    const start = performance.now();
    function frame(now) {
      const progress = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      count = Math.floor(ease * target);
      el.textContent = '~' + count.toLocaleString();
      if (progress < 1) requestAnimationFrame(frame);
      else el.textContent = '~2,000';
    }
    requestAnimationFrame(frame);
  }, 2400);
</script>
</body>
</html>

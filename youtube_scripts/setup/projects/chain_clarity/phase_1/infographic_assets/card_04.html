<!-- EXPORT: Stories/Reels 1080x1920px — adjust for vertical layout -->
<!-- Chain Clarity · Phase 1 · Card 04 · TAMPER WITH ONE. BREAK THE CHAIN. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Chain Clarity — Tamper With One. Break The Chain.</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:   #00D4AA;
      --gold:   #F5A623;
      --slate:  #8B9BB4;
      --navy:   #0A0E1A;
      --violet: #7B5CF0;
      --white:  #FFFFFF;
      --danger: #EF4444;
    }
    * { box-sizing:border-box; margin:0; padding:0; }

    @keyframes fadeIn   { from{opacity:0}                              to{opacity:1} }
    @keyframes slideDown{ from{transform:translateY(-28px);opacity:0}  to{transform:translateY(0);opacity:1} }
    @keyframes slideUp  { from{transform:translateY(40px);opacity:0}   to{transform:translateY(0);opacity:1} }
    @keyframes wordIn   { from{opacity:0;transform:translateY(8px)}    to{opacity:1;transform:translateY(0)} }
    @keyframes bounce   { 0%{transform:scale(0.6) translateY(20px);opacity:0} 60%{transform:scale(1.08) translateY(-4px)} 100%{transform:scale(1) translateY(0);opacity:1} }
    @keyframes stampIn  { 0%{transform:scale(1.6) rotate(-8deg);opacity:0} 60%{transform:scale(0.95) rotate(2deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    @keyframes cascadeIn{ from{opacity:0;transform:translateY(-10px)}  to{opacity:1;transform:translateY(0)} }

    body {
      width:1080px; height:1080px;
      background:var(--navy); overflow:hidden;
      font-family:'Inter',sans-serif;
    }
    .bg {
      position:absolute; inset:0;
      background: radial-gradient(ellipse at 40% 50%, rgba(239,68,68,0.04) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 20%, rgba(123,92,240,0.05) 0%, transparent 50%),
                  var(--navy);
      animation:fadeIn 0.2s ease-out forwards;
    }
    .card {
      position:relative; width:1080px; height:1080px;
      display:flex; flex-direction:column;
      padding:64px 80px;
    }

    /* Logo */
    .logo {
      display:flex; align-items:center; gap:16px;
      opacity:0; animation:slideDown 0.3s ease-out 0.3s forwards;
    }
    .logo-text .name { font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; color:var(--white); }
    .logo-text .name span { font-weight:300; color:var(--teal); }
    .logo-text .tag  { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--slate); margin-top:3px; }

    /* Headline */
    .headline { margin-top:36px; }
    .h-line1 {
      font-family:'Space Grotesk',sans-serif;
      font-size:92px; font-weight:700; color:var(--white);
      line-height:1; letter-spacing:-2px;
    }
    .h-line2 {
      font-family:'Space Grotesk',sans-serif;
      font-size:92px; font-weight:700; color:var(--teal);
      line-height:1; letter-spacing:-2px;
    }
    .word { display:inline-block; opacity:0; animation:wordIn 0.15s ease-out forwards; }
    .w1 { animation-delay:0.6s; }
    .w2 { animation-delay:0.75s; }
    .w3 { animation-delay:0.90s; }
    .w4 { animation-delay:1.05s; }
    .w5 { animation-delay:1.20s; }
    .w6 { animation-delay:1.35s; }
    .w7 { animation-delay:1.50s; }

    /* Cascade list */
    .cascade {
      display:flex; flex-direction:column; gap:14px;
      margin-top:40px; flex:1;
    }

    .cblock {
      display:flex; align-items:center; gap:20px;
      padding:20px 28px; border-radius:12px; border:2px solid;
      opacity:0;
    }
    .cblock.altered {
      border-color:var(--gold);
      background:rgba(245,166,35,0.06);
      animation:cascadeIn 0.3s ease-out 1.7s forwards;
    }
    .cblock.invalid {
      border-color:var(--danger);
      background:rgba(239,68,68,0.05);
    }
    .cblock.inv1 { animation:cascadeIn 0.3s ease-out 2.0s forwards; }
    .cblock.inv2 { animation:cascadeIn 0.3s ease-out 2.2s forwards; }
    .cblock.inv3 { animation:cascadeIn 0.3s ease-out 2.4s forwards; }

    .cb-label {
      font-family:'Space Grotesk',sans-serif;
      font-size:36px; font-weight:600;
      flex-shrink:0; width:180px;
    }
    .altered .cb-label { color:var(--gold); }
    .invalid .cb-label { color:var(--danger); }

    .cb-tag {
      font-family:'Inter',sans-serif;
      font-size:26px; color:var(--slate);
    }

    .cb-stamp {
      margin-left:auto;
      font-family:'Space Grotesk',sans-serif;
      font-size:26px; font-weight:700;
      padding:6px 18px; border-radius:8px;
      opacity:0;
    }
    .altered .cb-stamp {
      color:var(--gold); background:rgba(245,166,35,0.12); border:1px solid rgba(245,166,35,0.3);
      animation:stampIn 0.4s ease-out 2.0s forwards;
    }
    .invalid .cb-stamp {
      color:var(--danger); background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.3);
    }
    .inv1 .cb-stamp { animation:stampIn 0.4s ease-out 2.2s forwards; }
    .inv2 .cb-stamp { animation:stampIn 0.4s ease-out 2.4s forwards; }
    .inv3 .cb-stamp { animation:stampIn 0.4s ease-out 2.6s forwards; }

    .down-arrow {
      text-align:center;
      font-size:28px; color:var(--danger);
      opacity:0; margin: 0 auto; display:block; width:40px;
    }
    .da1 { animation:fadeIn 0.2s ease-out 2.1s forwards; }
    .da2 { animation:fadeIn 0.2s ease-out 2.3s forwards; }
    .da3 { animation:fadeIn 0.2s ease-out 2.5s forwards; }

    /* Conclusion */
    .conclusion {
      padding:24px 32px;
      background:rgba(123,92,240,0.10);
      border:1px solid rgba(123,92,240,0.30);
      border-radius:14px;
      opacity:0; animation:bounce 0.35s ease-out 2.9s forwards;
    }
    .con-line {
      font-family:'Space Grotesk',sans-serif;
      font-size:52px; font-weight:700; color:var(--violet); line-height:1.1;
    }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="card">

  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 62" width="52" height="45">
      <polygon points="42,30 32,47 12,47 2,30 12,13 32,13" fill="#00D4AA"/>
      <polygon points="68,30 58,47 38,47 28,30 38,13 58,13" fill="#0A0E1A" stroke="#7B5CF0" stroke-width="2.5"/>
      <polygon points="35,18 42,30 35,42 28,30" fill="#F5A623"/>
    </svg>
    <div class="logo-text">
      <div class="name">Chain <span>Clarity</span></div>
      <div class="tag">Blockchain without the noise</div>
    </div>
  </div>

  <div class="headline">
    <div class="h-line1">
      <span class="word w1">TAMPER&nbsp;</span><span class="word w2">WITH&nbsp;</span><span class="word w3">ONE.</span>
    </div>
    <div class="h-line2">
      <span class="word w4">BREAK&nbsp;</span><span class="word w5">THE&nbsp;</span><span class="word w6">CHAIN.</span>
    </div>
  </div>

  <div class="cascade">

    <div class="cblock altered">
      <div class="cb-label">Block 500</div>
      <div class="cb-tag">Attacker alters this</div>
      <div class="cb-stamp">HASH CHANGED</div>
    </div>

    <span class="down-arrow da1">↓</span>

    <div class="cblock invalid inv1">
      <div class="cb-label">Block 501</div>
      <div class="cb-tag">Stored old hash of 500</div>
      <div class="cb-stamp">NOW INVALID</div>
    </div>

    <span class="down-arrow da2">↓</span>

    <div class="cblock invalid inv2">
      <div class="cb-label">Block 502</div>
      <div class="cb-tag">Stored old hash of 501</div>
      <div class="cb-stamp">NOW INVALID</div>
    </div>

    <span class="down-arrow da3">↓</span>

    <div class="cblock invalid inv3">
      <div class="cb-label">Block 503...</div>
      <div class="cb-tag">Cascade continues</div>
      <div class="cb-stamp">NOW INVALID</div>
    </div>

  </div>

  <div class="conclusion">
    <div class="con-line">THE PAST CANNOT</div>
    <div class="con-line">BE REWRITTEN.</div>
  </div>

</div>
</body>
</html>

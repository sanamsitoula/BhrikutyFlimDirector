<!-- EXPORT: Instagram Post 1080x1080px · Stories 1080x1920px -->
<!-- CARD 02 — BITCOIN'S 21 MILLION HARD CAP -->
<!-- Chain Clarity · Phase 2 · Agent 12 — Infographic Asset Generator -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Card 02 — Bitcoin 21M Hard Cap</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:   #00D4AA;
      --gold:   #F5A623;
      --slate:  #8B9BB4;
      --navy:   #0A0E1A;
      --violet: #7B5CF0;
      --white:  #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      background: var(--navy);
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      position: relative;
    }

    /* ── BACKGROUND ── */
    .bg-radial {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(0,212,170,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 85%, rgba(245,166,35,0.07) 0%, transparent 60%);
      opacity: 0;
      animation: fadeIn 0.2s ease forwards;
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeIn    { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-28px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes slideUp   { from { opacity: 0; transform: translateY(32px)  } to { opacity: 1; transform: translateY(0) } }
    @keyframes wordIn    { from { opacity: 0; transform: translateY(12px)  } to { opacity: 1; transform: translateY(0) } }
    @keyframes bounce    { 0% { opacity: 0; transform: scale(0.7) translateY(20px) } 70% { transform: scale(1.05) translateY(-4px) } 100% { opacity: 1; transform: scale(1) translateY(0) } }
    @keyframes drawBar   { from { width: 0; opacity: 0 } to { width: 100%; opacity: 1 } }

    /* ── LOGO ── */
    .logo-wrap {
      position: absolute;
      top: 52px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: slideDown 0.3s ease forwards 0.2s;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -0.3px;
    }
    .logo-text span { color: var(--teal); }

    /* ── BIG STAT ── */
    .stat-block {
      position: absolute;
      top: 148px;
      left: 60px;
      right: 60px;
    }
    .big-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 108px;
      font-weight: 500;
      color: var(--teal);
      letter-spacing: -4px;
      line-height: 1;
      opacity: 0;
    }
    .stat-label {
      font-size: 56px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -1.5px;
      line-height: 1;
      margin-top: 8px;
      display: flex;
      gap: 14px;
    }
    .stat-label .word {
      opacity: 0;
      animation: wordIn 0.25s ease forwards;
    }
    .stat-label .word:nth-child(1) { animation-delay: 1.3s; }
    .stat-label .word:nth-child(2) { animation-delay: 1.38s; }
    .stat-label .word:nth-child(3) { animation-delay: 1.46s; }

    /* ── TIMELINE SECTION ── */
    .timeline-section {
      position: absolute;
      top: 444px;
      left: 60px;
      right: 60px;
      opacity: 0;
      animation: slideUp 0.4s ease forwards 1.6s;
    }
    .timeline-label {
      font-size: 26px;
      font-weight: 600;
      color: var(--slate);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* ── TIMELINE BAR ── */
    .timeline-bar-wrap {
      position: relative;
      height: 4px;
      background: rgba(139,155,180,0.2);
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .timeline-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--teal) 0%, var(--gold) 80%, var(--violet) 100%);
      border-radius: 2px;
      width: 0;
      opacity: 0;
      animation: drawBar 0.8s ease-out forwards 2.0s;
    }

    /* ── TIMELINE TICKS ── */
    .timeline-ticks {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .tick {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      animation: slideUp 0.25s ease forwards;
    }
    .tick:nth-child(1) { animation-delay: 2.10s; }
    .tick:nth-child(2) { animation-delay: 2.22s; }
    .tick:nth-child(3) { animation-delay: 2.34s; }
    .tick:nth-child(4) { animation-delay: 2.46s; }
    .tick:nth-child(5) { animation-delay: 2.58s; }
    .tick:nth-child(6) { animation-delay: 2.70s; }

    .tick-year {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 500;
      color: var(--slate);
    }
    .tick-reward {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 500;
      color: var(--gold);
    }
    .tick-unit {
      font-size: 20px;
      color: var(--slate);
      text-align: center;
      line-height: 1.2;
    }
    .tick.last .tick-year { color: var(--violet); }
    .tick.last .tick-reward { color: var(--violet); font-size: 28px; }

    /* ── FOOTER STRIP ── */
    .footer-strip {
      position: absolute;
      bottom: 96px;
      left: 60px;
      right: 60px;
      background: rgba(245,166,35,0.06);
      border: 1px solid rgba(245,166,35,0.2);
      border-radius: 10px;
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: slideUp 0.4s ease forwards 2.9s;
    }
    .footer-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      color: var(--slate);
    }
    .footer-stat span { color: var(--teal); font-weight: 500; }
    .footer-divider {
      width: 1px;
      height: 32px;
      background: rgba(139,155,180,0.25);
    }

    /* ── WORDMARK ── */
    .wordmark {
      position: absolute;
      bottom: 44px;
      right: 60px;
      font-size: 26px;
      font-weight: 600;
      color: rgba(139,155,180,0.5);
      letter-spacing: -0.3px;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 3.1s;
    }
    .wordmark span { color: rgba(0,212,170,0.6); }
  </style>
</head>
<body>

  <!-- Step 1: Background -->
  <div class="bg-radial"></div>

  <!-- Step 2: Logo -->
  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 62" width="48" height="41">
      <polygon points="42,30 32,47 12,47 2,30 12,13 32,13" fill="#00D4AA"/>
      <polygon points="68,30 58,47 38,47 28,30 38,13 58,13" fill="#0A0E1A" stroke="#7B5CF0" stroke-width="2.5"/>
      <polygon points="35,18 42,30 35,42 28,30" fill="#F5A623"/>
    </svg>
    <span class="logo-text">Chain<span>Clarity</span></span>
  </div>

  <!-- Step 3 + 5: Big counter stat -->
  <div class="stat-block">
    <div class="big-number" id="counterDisplay">21,000,000</div>
    <div class="stat-label">
      <span class="word">MAXIMUM</span>
      <span class="word">BTC.</span>
      <span class="word">EVER.</span>
    </div>
  </div>

  <!-- Steps 4–6: Timeline section -->
  <div class="timeline-section">
    <div class="timeline-label">Halving Timeline</div>
    <div class="timeline-bar-wrap">
      <div class="timeline-bar-fill"></div>
    </div>
    <div class="timeline-ticks">
      <div class="tick">
        <div class="tick-year">2009</div>
        <div class="tick-reward">50</div>
        <div class="tick-unit">BTC/<br>block</div>
      </div>
      <div class="tick">
        <div class="tick-year">2012</div>
        <div class="tick-reward">25</div>
        <div class="tick-unit">BTC/<br>block</div>
      </div>
      <div class="tick">
        <div class="tick-year">2016</div>
        <div class="tick-reward">12.5</div>
        <div class="tick-unit">BTC/<br>block</div>
      </div>
      <div class="tick">
        <div class="tick-year">2020</div>
        <div class="tick-reward">6.25</div>
        <div class="tick-unit">BTC/<br>block</div>
      </div>
      <div class="tick">
        <div class="tick-year">2024</div>
        <div class="tick-reward">3.125</div>
        <div class="tick-unit">BTC/<br>block</div>
      </div>
      <div class="tick last">
        <div class="tick-year">~2140</div>
        <div class="tick-reward">last<br>coin</div>
        <div class="tick-unit">supply<br>sealed</div>
      </div>
    </div>
  </div>

  <!-- Footer strip -->
  <div class="footer-strip">
    <div class="footer-stat"><span>~19.7M</span> already mined</div>
    <div class="footer-divider"></div>
    <div class="footer-stat"><span>1.3M</span> remaining</div>
  </div>

  <!-- Wordmark -->
  <div class="wordmark">Chain<span>Clarity</span></div>

  <script>
    // Step 5: Counter animation — counts from 0 to 21,000,000
    const display = document.getElementById('counterDisplay');
    const target  = 21000000;
    const duration = 1200;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function formatNum(n) {
      return Math.floor(n).toLocaleString('en-US');
    }

    let startTime = null;

    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed  = timestamp - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased    = easeOutCubic(progress);
      const current  = eased * target;

      display.textContent = formatNum(current);
      display.style.opacity = 1;

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        display.textContent = '21,000,000';
      }
    }

    // Start counter after logo + headline delay (0.5s)
    setTimeout(() => requestAnimationFrame(animate), 500);
  </script>
</body>
</html>

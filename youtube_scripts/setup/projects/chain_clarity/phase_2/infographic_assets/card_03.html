<!-- EXPORT: Instagram Post 1080x1080px · YouTube Thumbnail 1280x720px -->
<!-- CARD 03 — TWO TOOLS. DIFFERENT JOBS. (Bitcoin vs Ethereum) -->
<!-- Chain Clarity · Phase 2 · Agent 12 — Infographic Asset Generator -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Card 03 — Bitcoin vs Ethereum</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:   #00D4AA;
      --gold:   #F5A623;
      --slate:  #8B9BB4;
      --navy:   #0A0E1A;
      --violet: #7B5CF0;
      --white:  #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      background: var(--navy);
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      position: relative;
    }

    /* ── BACKGROUND ── */
    .bg-radial {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 70% at 20% 55%, rgba(245,166,35,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 50% 70% at 80% 55%, rgba(123,92,240,0.07) 0%, transparent 65%);
      opacity: 0;
      animation: fadeIn 0.2s ease forwards;
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeIn    { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-28px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes slideUp   { from { opacity: 0; transform: translateY(32px)  } to { opacity: 1; transform: translateY(0) } }
    @keyframes wordIn    { from { opacity: 0; transform: translateY(12px)  } to { opacity: 1; transform: translateY(0) } }
    @keyframes bounce    { 0% { opacity: 0; transform: scale(0.8) translateY(16px) } 70% { transform: scale(1.04) translateY(-4px) } 100% { opacity: 1; transform: scale(1) translateY(0) } }
    @keyframes strokeDraw {
      from { stroke-dashoffset: 600; opacity: 0; }
      to   { stroke-dashoffset: 0;   opacity: 1; }
    }

    /* ── LOGO ── */
    .logo-wrap {
      position: absolute;
      top: 52px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: slideDown 0.3s ease forwards 0.2s;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -0.3px;
    }
    .logo-text span { color: var(--teal); }

    /* ── HEADLINE BLOCK ── */
    .headline-block {
      position: absolute;
      top: 148px;
      left: 60px;
      right: 60px;
    }
    .headline {
      font-size: 88px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -3px;
      line-height: 1;
      display: flex;
      gap: 18px;
    }
    .headline .word {
      opacity: 0;
      animation: wordIn 0.25s ease forwards;
    }
    .headline .word:nth-child(1) { animation-delay: 0.5s; }
    .headline .word:nth-child(2) { animation-delay: 0.58s; }

    .sub-headline {
      font-size: 88px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: -3px;
      line-height: 1;
      margin-top: 4px;
      display: flex;
      gap: 18px;
    }
    .sub-headline .word {
      opacity: 0;
      animation: wordIn 0.25s ease forwards;
    }
    .sub-headline .word:nth-child(1) { animation-delay: 0.66s; }
    .sub-headline .word:nth-child(2) { animation-delay: 0.74s; }

    /* ── PANEL GRID ── */
    .panels {
      position: absolute;
      top: 376px;
      left: 60px;
      right: 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    /* ── HEX PANEL ── */
    .panel {
      border-radius: 14px;
      padding: 32px 28px;
      opacity: 0;
    }
    .panel-btc {
      background: rgba(245,166,35,0.06);
      border: 1.5px solid var(--gold);
      animation: slideUp 0.4s ease forwards 1.15s;
    }
    .panel-eth {
      background: rgba(123,92,240,0.06);
      border: 1.5px solid var(--violet);
      animation: slideUp 0.4s ease forwards 1.3s;
    }

    /* Hex SVG icon */
    .panel-icon {
      margin-bottom: 16px;
    }
    .hex-stroke {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      opacity: 0;
    }
    .panel-btc .hex-stroke {
      animation: strokeDraw 0.5s ease forwards 1.35s;
    }
    .panel-eth .hex-stroke {
      animation: strokeDraw 0.5s ease forwards 1.65s;
    }

    .panel-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    .panel-btc .panel-title { color: var(--gold); }
    .panel-eth .panel-title { color: var(--violet); }

    .panel-line {
      font-size: 28px;
      font-weight: 500;
      color: var(--slate);
      line-height: 1.4;
      padding: 8px 0;
      border-bottom: 1px solid rgba(139,155,180,0.12);
      opacity: 0;
      animation: slideUp 0.25s ease forwards;
    }
    .panel-line:last-child { border-bottom: none; }

    .panel-btc .panel-line:nth-child(3) { animation-delay: 1.50s; }
    .panel-btc .panel-line:nth-child(4) { animation-delay: 1.62s; }
    .panel-btc .panel-line:nth-child(5) { animation-delay: 1.74s; }
    .panel-eth .panel-line:nth-child(3) { animation-delay: 1.65s; }
    .panel-eth .panel-line:nth-child(4) { animation-delay: 1.77s; }
    .panel-eth .panel-line:nth-child(5) { animation-delay: 1.89s; }

    .highlight-teal { color: var(--teal); font-weight: 600; }

    /* ── CALLOUT STRIP ── */
    .callout {
      position: absolute;
      bottom: 96px;
      left: 60px;
      right: 60px;
      background: rgba(123,92,240,0.10);
      border: 1px solid rgba(123,92,240,0.35);
      border-radius: 10px;
      padding: 22px 36px;
      text-align: center;
      font-size: 38px;
      font-weight: 700;
      color: var(--violet);
      letter-spacing: -0.5px;
      opacity: 0;
      animation: bounce 0.3s ease forwards 2.1s;
    }

    /* ── WORDMARK ── */
    .wordmark {
      position: absolute;
      bottom: 44px;
      right: 60px;
      font-size: 26px;
      font-weight: 600;
      color: rgba(139,155,180,0.5);
      letter-spacing: -0.3px;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 2.4s;
    }
    .wordmark span { color: rgba(0,212,170,0.6); }
  </style>
</head>
<body>

  <!-- Step 1: Background -->
  <div class="bg-radial"></div>

  <!-- Step 2: Logo -->
  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 62" width="48" height="41">
      <polygon points="42,30 32,47 12,47 2,30 12,13 32,13" fill="#00D4AA"/>
      <polygon points="68,30 58,47 38,47 28,30 38,13 58,13" fill="#0A0E1A" stroke="#7B5CF0" stroke-width="2.5"/>
      <polygon points="35,18 42,30 35,42 28,30" fill="#F5A623"/>
    </svg>
    <span class="logo-text">Chain<span>Clarity</span></span>
  </div>

  <!-- Step 3: Headline typewriter -->
  <div class="headline-block">
    <div class="headline">
      <span class="word">TWO</span>
      <span class="word">TOOLS.</span>
    </div>
    <div class="sub-headline">
      <span class="word">DIFFERENT</span>
      <span class="word">JOBS.</span>
    </div>
  </div>

  <!-- Steps 4–5: Panels slide up, content reveals -->
  <div class="panels">

    <!-- Bitcoin Panel -->
    <div class="panel panel-btc">
      <div class="panel-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70" width="56" height="49">
          <polygon
            points="56,35 46,52 26,52 16,35 26,18 46,18"
            fill="rgba(245,166,35,0.10)"
            stroke="#F5A623"
            stroke-width="2"
            class="hex-stroke"
          />
          <text x="40" y="42" text-anchor="middle" fill="#F5A623" font-family="JetBrains Mono" font-size="20" font-weight="500">₿</text>
        </svg>
      </div>
      <div class="panel-title">BITCOIN</div>
      <div class="panel-line">Send &amp; receive value</div>
      <div class="panel-line">Fixed supply</div>
      <div class="panel-line">Currency only</div>
    </div>

    <!-- Ethereum Panel -->
    <div class="panel panel-eth">
      <div class="panel-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70" width="56" height="49">
          <polygon
            points="56,35 46,52 26,52 16,35 26,18 46,18"
            fill="rgba(123,92,240,0.10)"
            stroke="#7B5CF0"
            stroke-width="2"
            class="hex-stroke"
          />
          <text x="40" y="42" text-anchor="middle" fill="#7B5CF0" font-family="JetBrains Mono" font-size="20" font-weight="500">Ξ</text>
        </svg>
      </div>
      <div class="panel-title">ETHEREUM</div>
      <div class="panel-line">Run code on-chain</div>
      <div class="panel-line"><span class="highlight-teal">IF/THEN</span> logic runs</div>
      <div class="panel-line">automatically, no server</div>
    </div>

  </div>

  <!-- Step 6: Callout bounce -->
  <div class="callout">ETHEREUM ADDED THE IF/THEN</div>

  <!-- Wordmark -->
  <div class="wordmark">Chain<span>Clarity</span></div>

</body>
</html>

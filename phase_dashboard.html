<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase Dashboard — Bhrikuty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0A0E1A;
  --bg2:       #0F1525;
  --card:      #141B2D;
  --card2:     #1A2238;
  --border:    #1E2A42;
  --teal:      #00D4AA;
  --teal-dim:  rgba(0,212,170,0.12);
  --gold:      #F5A623;
  --gold-dim:  rgba(245,166,35,0.12);
  --red:       #FF4D6A;
  --red-dim:   rgba(255,77,106,0.12);
  --blue:      #4D94FF;
  --blue-dim:  rgba(77,148,255,0.12);
  --purple:    #A855F7;
  --green:     #22C55E;
  --green-dim: rgba(34,197,94,0.12);
  --text:      #E8EDF5;
  --text2:     #8A97B0;
  --muted:     #4A5568;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ── TOP NAV ── */
.topnav{
  display:flex;align-items:center;gap:12px;
  padding:12px 24px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;
  flex-wrap:wrap;
}
.back-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:7px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text2);font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;
  transition:all .2s;
}
.back-btn:hover{border-color:var(--teal);color:var(--teal);}
.nav-crumb{font-size:12px;color:var(--muted);}
.nav-crumb span{color:var(--text2);}
.nav-title{font-size:15px;font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-right{display:flex;gap:8px;align-items:center;margin-left:auto;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s;
}
.btn-teal{background:var(--teal);color:var(--bg);}
.btn-teal:hover{background:#00EDBC;transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:var(--bg);}
.btn-gold:hover{background:#FFB83F;}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text2);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
.badge{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.badge-teal{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,170,.3);}
.badge-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,166,35,.3);}
.badge-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,.3);}
.badge-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(77,148,255,.3);}
.badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.3);}

/* ── LAYOUT ── */
.page{max-width:1400px;margin:0 auto;padding:20px 24px 60px;}

/* ── PHASE HEADER ── */
.phase-header{
  display:flex;align-items:flex-start;gap:16px;
  padding:20px 24px;
  background:linear-gradient(135deg,var(--bg2),var(--card));
  border:1px solid var(--border);border-radius:14px;
  margin-bottom:20px;
}
.phase-num-big{
  width:56px;height:56px;border-radius:14px;flex-shrink:0;
  background:var(--teal-dim);border:2px solid rgba(0,212,170,.4);
  color:var(--teal);font-family:'Space Grotesk',sans-serif;
  font-size:26px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.phase-info{flex:1;}
.phase-info h1{font-size:22px;color:var(--text);margin-bottom:6px;line-height:1.25;}
.phase-meta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.meta-chip{font-size:11px;color:var(--text2);}
.progress-bar-wrap{margin-top:10px;}
.progress-label{font-size:11px;color:var(--text2);margin-bottom:4px;}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(to right,var(--teal),#00EDBC);transition:width 1s ease;}

/* ── PIPELINE TABLE ── */
.section-title{
  font-size:13px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.pipeline-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
.pipeline-table th{
  text-align:left;padding:9px 12px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.pipeline-table td{
  padding:10px 12px;
  border-bottom:1px solid rgba(30,42,66,.6);
  vertical-align:middle;
}
.pipeline-table tr:hover td{background:rgba(255,255,255,.02);}
.step-num-cell{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
}
.step-done  .step-num-cell{background:var(--teal-dim);color:var(--teal);}
.step-pending .step-num-cell{background:var(--border);color:var(--muted);}
.step-name{font-size:13px;font-weight:600;color:var(--text);}
.step-files{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.step-file-chip{
  padding:1px 7px;border-radius:5px;font-size:10px;
  font-family:'Courier New',monospace;
  background:var(--bg);border:1px solid var(--border);color:var(--text2);
}
.status-dot{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;white-space:nowrap;
}
.status-dot.done{color:var(--teal);}
.status-dot.pending{color:var(--muted);}
.status-dot.warn{color:var(--gold);}
.step-action-btn{
  padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;
  white-space:nowrap;border:none;
}
.step-action-btn.view{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,170,.3);}
.step-action-btn.view:hover{background:var(--teal);color:var(--bg);}
.step-action-btn.run{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,166,35,.3);}
.step-action-btn.run:hover{background:var(--gold);color:var(--bg);}
.step-action-btn.preview{background:var(--purple-dim,rgba(168,85,247,.12));color:var(--purple);border:1px solid rgba(168,85,247,.3);}
.step-action-btn.preview:hover{background:var(--purple);color:white;}

/* ── TABS ── */
.tabs-bar{
  display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--border);
  scrollbar-width:none;margin-bottom:0;
}
.tabs-bar::-webkit-scrollbar{display:none;}
.tab-btn{
  display:flex;align-items:center;gap:6px;
  padding:10px 18px;background:none;border:none;
  border-bottom:2px solid transparent;
  color:var(--text2);font-size:13px;font-weight:500;
  cursor:pointer;font-family:'Inter',sans-serif;
  transition:all .2s;white-space:nowrap;margin-bottom:-1px;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
.tab-panel{display:none;padding:20px 0;}
.tab-panel.active{display:block;}

/* ── FILE VIEWER ── */
.file-viewer{
  background:#06090F;border:1px solid var(--border);border-radius:10px;
  overflow:hidden;
}
.file-viewer-header{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--border);
}
.file-viewer-name{font-family:'Courier New',monospace;font-size:12px;color:var(--teal);font-weight:600;}
.file-viewer-size{font-size:11px;color:var(--muted);margin-left:auto;}
.copy-content-btn{
  padding:3px 10px;background:var(--teal-dim);border:1px solid rgba(0,212,170,.3);
  border-radius:6px;color:var(--teal);font-size:11px;font-weight:600;
  cursor:pointer;font-family:'Inter',sans-serif;
}
.copy-content-btn:hover{background:var(--teal);color:var(--bg);}
.file-content{
  padding:16px 20px;max-height:520px;overflow-y:auto;
  font-family:'Courier New',Consolas,monospace;font-size:12.5px;
  line-height:1.75;color:#8A97B0;white-space:pre-wrap;word-break:break-word;
}
.file-content .md-h1{color:var(--teal);font-size:14px;font-weight:700;}
.file-content .md-h2{color:var(--gold);font-size:13px;font-weight:700;}
.file-content .md-h3{color:var(--blue);font-weight:600;}
.file-content .md-code{color:#00FF9F;background:rgba(0,255,159,.07);padding:0 4px;border-radius:3px;}
.file-content .srt-ts{color:var(--teal);}
.file-content .srt-idx{color:var(--muted);}
.file-content.json{color:#A8D8A8;}

/* ── INFOGRAPHICS ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.card-frame-wrap{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;transition:all .2s;
}
.card-frame-wrap:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.3);}
.card-frame-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;border-bottom:1px solid var(--border);
}
.card-frame-name{font-size:11px;font-family:'Courier New',monospace;color:var(--text2);}
.card-frame-actions{display:flex;gap:6px;}
.card-frame-btn{
  padding:3px 9px;border-radius:5px;font-size:10px;font-weight:600;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;border:none;
}
.card-frame-btn.open{background:var(--teal-dim);color:var(--teal);}
.card-frame-btn.open:hover{background:var(--teal);color:var(--bg);}
.card-frame-container{
  position:relative;width:100%;padding-top:100%;/* 1:1 */
  background:#000;overflow:hidden;
}
.card-frame-container iframe{
  position:absolute;top:0;left:0;
  width:1080px;height:1080px;
  transform-origin:top left;
  border:none;pointer-events:none;
}

/* ── AUDIO / VIDEO PLAYER ── */
.media-section{
  padding:24px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;text-align:center;
}
.media-placeholder{color:var(--muted);font-size:13px;}
.media-placeholder .icon{font-size:48px;margin-bottom:12px;}
audio,video{width:100%;border-radius:8px;outline:none;}
video{max-height:480px;background:#000;}

/* ── OVERVIEW ── */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.overview-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
.overview-card h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;}
.yt-chapter{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid rgba(30,42,66,.5);}
.yt-chapter:last-child{border-bottom:none;}
.yt-ts{font-size:12px;color:var(--teal);font-family:'Courier New',monospace;flex-shrink:0;}
.yt-ch-title{font-size:12px;color:var(--text2);}
.cut-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(30,42,66,.5);}
.cut-row:last-child{border-bottom:none;}
.cut-platform{font-size:12px;font-weight:600;color:var(--text);width:100px;flex-shrink:0;}
.cut-info{font-size:11px;color:var(--text2);}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;}
.tag{padding:3px 9px;border-radius:8px;font-size:11px;background:var(--bg);border:1px solid var(--border);color:var(--text2);}

/* ── LOADING ── */
.loading{text-align:center;padding:60px;color:var(--muted);font-size:13px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--card);border:1px solid var(--teal);border-radius:8px;
  padding:10px 16px;font-size:12px;font-weight:500;color:var(--teal);
  z-index:9999;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}

/* ── TERMINAL MINI ── */
.mini-terminal{
  background:#06090F;border:1px solid var(--teal);border-radius:10px;
  margin-top:12px;overflow:hidden;display:none;
}
.mini-terminal.open{display:block;}
.mini-terminal-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);}
.mini-terminal-title{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;}
.mini-terminal-body{padding:12px;font-family:'Courier New',monospace;font-size:11px;line-height:1.6;color:#8A97B0;max-height:200px;overflow-y:auto;}
.t-teal{color:var(--teal);}
.t-gold{color:var(--gold);}
.t-red{color:var(--red);}
.t-dim{color:var(--muted);}

@media(max-width:768px){
  .overview-grid{grid-template-columns:1fr;}
  .cards-grid{grid-template-columns:1fr;}
}

/* ── PLATFORM OUTPUT CARDS ── */
.platform-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
.platform-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s;}
.platform-card.has-content{border-color:rgba(0,212,170,.35);}
.platform-card-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg2);}
.platform-card.has-content .platform-card-head{background:var(--teal-dim);}
.platform-card-body{padding:10px 14px;}
.output-file-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid rgba(30,42,66,.4);}
.output-file-row:last-child{border-bottom:none;}
.output-preview{display:none;padding:0 14px 10px;}
.output-generate-cmd{background:#06090F;border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:6px;}
/* ── SUB-STEP ROWS ── */
.substep-row td { border-bottom:1px solid rgba(20,27,45,.9); }
.substep-num{
  width:34px;height:26px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;font-family:'Space Grotesk',sans-serif;
  background:var(--bg);color:var(--muted);border:1px solid var(--border);
}
.substep-row.step-done .substep-num{background:var(--teal-dim);color:var(--teal);border-color:rgba(0,212,170,.3);}
/* ── CMD BLOCK ROW ── */
.cmd-row td{padding:0 12px 10px 52px;background:rgba(0,0,0,.3);}
.cmd-block{
  background:#06090F;border:1px solid var(--border);border-radius:7px;
  padding:10px 14px;overflow:hidden;
}
.cmd-block code{
  font-family:'Courier New',Consolas,monospace;font-size:11px;
  color:var(--teal);white-space:pre-wrap;word-break:break-all;display:block;margin-top:6px;
}
/* ── INLINE FILE EDITOR ── */
.file-editor-label{font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.file-editor-textarea{
  width:100%;background:#06090F;color:#C8D8E8;
  border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;font-family:'Courier New',Consolas,monospace;
  font-size:12.5px;line-height:1.75;resize:vertical;
  outline:none;box-sizing:border-box;min-height:280px;
  transition:border-color .2s;
}
.file-editor-textarea:focus{border-color:var(--teal);}
.file-editor-bar{margin-top:8px;display:flex;gap:8px;justify-content:flex-end;align-items:center;}
.file-editor-status{font-size:11px;}

/* ── VERSION HISTORY OVERLAY ── */
#version-overlay{animation:fadeInOverlay .15s ease;}
@keyframes fadeInOverlay{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<!-- ── TOP NAV ── -->
<nav class="topnav">
  <a class="back-btn" href="/">← Dashboard</a>
  <span class="nav-crumb"><span id="crumb-project">…</span> / Phase <span id="crumb-phase">…</span></span>
  <span class="nav-title" id="nav-title">Loading…</span>
  <div class="nav-right">
    <span id="nav-compliance" class="badge">—</span>
    <a href="/tools" target="_blank" class="btn btn-ghost" style="font-size:12px;">🛠️ Tools</a>
  <button class="btn btn-ghost" id="btn-open-main" onclick="window.open('/','_blank')">🔗 Main Dashboard</button>
    <button class="btn btn-gold" id="btn-run" onclick="runPhase()">▶ Run Pipeline</button>
  </div>
</nav>

<div class="page" id="page">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Loading phase data…
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────────
// Parse project + phase from URL: /phase/{project}/{num}
// ─────────────────────────────────────────────────
const urlParts = window.location.pathname.replace(/\/$/, '').split('/');
const PROJECT = urlParts[2] || 'chain_clarity';
const PHASE   = parseInt(urlParts[3]) || 1;
const API     = '';   // same origin

let phaseData = null;
let activeFile = null;

// ─────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────
async function init() {
  document.getElementById('crumb-project').textContent = PROJECT;
  document.getElementById('crumb-phase').textContent   = PHASE;
  document.title = `Phase ${PHASE} — ${PROJECT}`;

  try {
    const r = await fetch(`${API}/api/phase-data?project=${PROJECT}&phase=${PHASE}`);
    if (!r.ok) throw new Error('Phase not found');
    phaseData = await r.json();
    render();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:var(--red);font-size:14px;">Error: ${e.message}<br><a href="/" style="color:var(--teal);">← Back to dashboard</a></div>`;
  }
}

// ─────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────
function render() {
  const d = phaseData;
  document.title = `Phase ${d.phase}: ${d.title}`;
  document.getElementById('nav-title').textContent = d.title;

  // Compliance badge
  const compMap = {
    PASS:              ['badge-teal', '✅ PASS'],
    PASS_WITH_WARNINGS:['badge-gold', '⚠️ PASS WITH WARNINGS'],
    FAIL:              ['badge-red',  '❌ FAIL'],
  };
  const [cls, label] = compMap[d.compliance_status] || ['badge-blue', d.compliance_status || 'Unknown'];
  const nb = document.getElementById('nav-compliance');
  nb.className = 'badge ' + cls;
  nb.textContent = label;

  const pct = Math.round((d.steps_done / d.steps_total) * 100);
  const page = document.getElementById('page');
  page.innerHTML = `
    <!-- Phase header -->
    <div class="phase-header">
      <div class="phase-num-big">${d.phase}</div>
      <div class="phase-info">
        <h1>${d.title}</h1>
        <div class="phase-meta-row">
          <span class="meta-chip">⏱ ${d.duration_min} min</span>
          <span class="meta-chip">📁 ${d.files.length} files</span>
          <span class="meta-chip">🃏 ${d.cards.length} cards</span>
          <span class="meta-chip">📋 ${d.steps_done}/${d.steps_total} steps done</span>
          <span class="badge ${cls}" style="font-size:10px;">${label}</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-label">Pipeline progress — ${pct}% complete</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div>
    </div>

    <!-- Pipeline steps table -->
    <div class="section-title">
      📋 Pipeline Steps
      <span class="badge badge-blue">${d.steps_done}/${d.steps_total} Complete</span>
    </div>
    ${renderPipelineTable(d.pipeline_steps)}

    <!-- Tabs -->
    <div style="margin-top:24px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;">
      <div class="tabs-bar" id="tabs-bar">
        <button class="tab-btn active" onclick="switchTab('overview',this)">🗂 Overview</button>
        <button class="tab-btn" onclick="switchTab('script',this)">📄 Script</button>
        <button class="tab-btn" onclick="switchTab('short',this)">⚡ Short Script</button>

      <div class="mini-terminal-body" id="mini-body"></div>

  `;

  // Scale iframes after render
  requestAnimationFrame(scaleIframes);

// ─────────────────────────────────────────────────
// CMD BLOCK helpers
// ─────────────────────────────────────────────────
function toggleCmd(id) {
  const row = document.getElementById(id);
  if (!row) return;
  row.style.display = row.style.display === 'none' ? '' : 'none';
}
function copyCmd(codeId) {
  const el = document.getElementById(codeId);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => showToast('Command copied!'));
}
async function runStepCmd(runData) {
  const term = document.getElementById('mini-terminal');
  const body = document.getElementById('mini-body');
  if (!term || !body) return;
  term.classList.add('open'); body.innerHTML = '';
  document.getElementById('mini-badge').textContent = 'RUNNING';
  document.getElementById('mini-badge').style.color = 'var(--gold)';
  const label = runData.only ? `generate --only ${runData.only}` : 'generate (full)';
  appendMini(`$ python tools/generate_phase.py  [${label}]\n\n`, 't-teal');
  try {
    const res = await fetch('/api/run-step', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(runData)
    });
    const { job_id } = await res.json();
    streamJob(job_id);
  } catch(e) {
    appendMini(`[ERROR] ${e.message}\n`, 't-red');
  }
}

function _cmdRow(rowId, codeId, cmdText, runData) {
  const rdJson = JSON.stringify(runData || {}).replace(/'/g, '&#39;');
  return `<tr id="${rowId}" class="cmd-row" style="display:none;">
    <td colspan="4">
      <div class="cmd-block">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);">Run Command</span>
          <div style="display:flex;gap:5px;">
            <button class="step-action-btn view" style="font-size:10px;padding:3px 9px;" onclick="copyCmd('${codeId}')">📋 Copy</button>
            ${runData ? `<button class="step-action-btn run" style="font-size:10px;padding:3px 9px;" onclick='runStepCmd(${rdJson})'>▶ Run</button>` : ''}
          </div>
        </div>
        <code id="${codeId}">${esc(cmdText)}</code>
      </div>
    </td>
  </tr>`;
}

// ─────────────────────────────────────────────────
// PIPELINE TABLE
// ─────────────────────────────────────────────────
function getStepHint(num, d) {
  const b   = d?.brand         || {};
  const rp  = d?.roadmap_phase || {};
  const clr = b.colors         || {};
  const primary   = clr.primary?.hex   || '';
  const secondary = clr.secondary?.hex || '';
  const topic     = rp.title || d?.title || 'this phase';
  const duration  = d?.duration_min || 12;
  const bd = rp.content_breakdown || [];
  const lf = bd.find(c => c.type==='long-form');
  const ar = bd.find(c => c.type==='article');
  const ig = bd.find(c => c.type==='infographic');
  const th = bd.find(c => c.type==='thread');
  const hints = {
    1: `Topic: ${topic} · ${lf?lf.duration_min:duration}min YouTube script + 60s TikTok cut + voiceover brief`,
    2: `Checks tone, colors${primary?' ('+primary+')':''}, typography, animation, sound identity`,
    3: `~${duration}min audio · Kokoro / ElevenLabs TTS · pacing from voiceover_brief.md`,
    4: `${ig?ig.card_count:4} cards · 1080×1080px (Instagram) · ${primary}${secondary?' + '+secondary:''}`,
    5: `python tools/video/create_video.py --project ${d?.project||PROJECT} --phase ${d?.phase||PHASE} --burn-subs --shorts`,
    6: `Auto-generate SRT caption file from voiceover audio`,
    7: `TikTok 9:16 · Instagram 1:1 · Twitter 16:9`,
    8: `${ar?ar.words:1500}-word article · ${th?th.tweets:7}-tweet thread · LinkedIn post`,
    9: `Upload to ${(b.platforms||['YouTube','TikTok','Instagram']).join(', ')} · review all outputs`,
  };
  return hints[num] || '';
}

function toggleSubsteps(stepNum) {
  const rows = document.querySelectorAll(`[data-parent="${stepNum}"]`);
  const anyVisible = [...rows].some(r => r.style.display !== 'none');
  const arrow = document.querySelector(`#step-row-${stepNum} .step-num-cell span`);
  rows.forEach(r => r.style.display = anyVisible ? 'none' : '');
  if (arrow) arrow.textContent = anyVisible ? '▶' : '▼';
}

// Map pipeline step number → step_key used in .versions/
const _STEP_KEY_MAP = {
  3: 'voiceover', 4: 'script', 5: 'video',
  7: 'platform',  8: 'text',   2: 'compliance',
};

function renderVersionBadges(stepNum) {
  const sv = phaseData?.step_versions || {};
  const key = _STEP_KEY_MAP[stepNum];
  if (!key || !sv[key] || !sv[key].length) return '';
  const versions = sv[key];  // already sorted newest-first
  const latest = versions[0];
  const count  = versions.length;
  return `
    <span onclick="showVersionHistory('${key}')"
          style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;
                 padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;
                 background:var(--teal-dim);border:1px solid rgba(0,212,170,.35);
                 color:var(--teal);margin-left:6px;" title="Click to see version history">
      📁 ${count} version${count > 1 ? 's' : ''}
      <span style="background:var(--teal);color:var(--bg);border-radius:3px;
                   padding:1px 4px;font-size:9px;">latest: v${latest.version}</span>
    </span>`;
}

async function showVersionHistory(stepKey) {
  // Build modal content from phaseData.step_versions
  const sv = phaseData?.step_versions || {};
  const versions = sv[stepKey] || [];

  const rows = versions.map(v => {
    const date = v.ts ? new Date(v.ts * 1000).toLocaleString() : '—';
    const fileList = (v.files || []).map(f => `
      <div style="display:flex;align-items:center;gap:8px;padding:4px 0;
                  border-bottom:1px solid rgba(30,42,66,.4);">
        <span style="font-size:11px;color:var(--teal);font-family:'Courier New',monospace;flex:1;">${esc(f.name)}</span>
        <span style="font-size:10px;color:var(--muted);">${f.size_mb} MB</span>
      </div>`).join('');

    return `
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;
                  margin-bottom:10px;overflow:hidden;">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;
                    background:${v.version === versions[0].version ? 'var(--teal-dim)' : 'var(--bg)'};
                    border-bottom:1px solid var(--border);">
          <span style="font-size:13px;font-weight:800;color:var(--teal);
                       font-family:'Space Grotesk',sans-serif;">v${v.version}</span>
          ${v.version === versions[0].version
            ? '<span class="badge badge-teal" style="font-size:9px;">LATEST</span>'
            : ''}
          <span style="font-size:11px;color:var(--muted);margin-left:auto;">🕐 ${date}</span>
        </div>
        <div style="padding:8px 12px;">${fileList || '<span style="font-size:11px;color:var(--muted);">No files recorded</span>'}</div>
      </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:12px;padding:12px;">No versions yet. Run this step to create v1.</div>';

  // Show in a floating overlay
  let overlay = document.getElementById('version-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'version-overlay';
    overlay.style.cssText = `
      position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);
      z-index:9000;display:flex;align-items:center;justify-content:center;
    `;
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
  }

  const stepLabel = stepKey.charAt(0).toUpperCase() + stepKey.slice(1);
  overlay.innerHTML = `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;
                width:min(580px,90vw);max-height:80vh;overflow:hidden;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;
                  background:var(--bg2);border-bottom:1px solid var(--border);">
        <span style="font-size:15px;">📁</span>
        <span style="font-size:14px;font-weight:700;color:var(--text);">
          Version History — ${stepLabel}
        </span>
        <span class="badge badge-teal" style="font-size:10px;">${versions.length} version${versions.length!==1?'s':''}</span>
        <button onclick="document.getElementById('version-overlay').remove()"
                style="margin-left:auto;background:none;border:none;color:var(--text2);
                       cursor:pointer;font-size:18px;line-height:1;">✕</button>
      </div>
      <div style="padding:16px 18px;overflow-y:auto;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">
          Older versions are saved in
          <code style="color:var(--teal);">phase_${PHASE}/.versions/${stepKey}/</code>
          — new versions are created on each re-run.
        </div>
        ${rows}
      </div>
    </div>`;
}

function renderPipelineTable(steps) {
  const rows = steps.map(s => {
    const isDone = s.done;
    const status = isDone
      ? `<span class="status-dot done">✅ Done</span>`
      : `<span class="status-dot pending">⬜ Pending</span>`;

    const chips = (s.key_files || []).slice(0, 3).map(f => {
      const viewable = (f.endsWith('.md') || f.endsWith('.srt') || f.endsWith('.json'))
                       && !f.startsWith('_output');
      const vc = phaseData?.view_counts?.[f];
      const vcTip = vc ? ` · ${vc} view${vc>1?'s':''}` : '';
      return viewable
        ? `<span class="step-file-chip" style="cursor:pointer;border-color:rgba(0,212,170,.25);"
                onclick="openContentModal('view:${f}','${f}')"
                title="Click to preview ${f}${vcTip}">${f}${vc?`<span style='opacity:.6;font-size:9px;margin-left:3px;'>👁${vc}</span>`:''}</span>`
        : `<span class="step-file-chip">${f}</span>`;
    }).join('');

    const hint  = getStepHint(s.num, phaseData);
    const subs  = s.substeps || [];
    const hasSubs = subs.length > 0;

    const action = s.action || '';
    let btnClass = 'view', btnLabel = '👁 View';
    if (action.startsWith('run:'))     { btnClass = 'run';     btnLabel = '▶ Run'; }
    if (action.startsWith('tab:'))     { btnClass = 'preview'; btnLabel = '👀 Preview'; }
    if (action === 'tab:infographics') { btnLabel = '🃏 Preview'; }

    const parentRow = `<tr class="${isDone?'step-done':'step-pending'}" id="step-row-${s.num}">
      <td style="width:40px;padding:10px 8px;">
        <div class="step-num-cell"${hasSubs ? ` style="cursor:pointer;" onclick="toggleSubsteps(${s.num})" title="Toggle sub-steps"` : ''}>${s.num}${hasSubs ? `<span style="font-size:8px;display:block;color:var(--teal);margin-top:1px;">▼</span>` : ''}</div>
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span class="step-name">${s.name}</span>
          ${hasSubs ? `<span style="font-size:9px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 6px;">${subs.length} sub-steps</span>` : ''}
          ${renderVersionBadges(s.num)}
        </div>
        ${hint ? `<div style="font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5;">${esc(hint)}</div>` : ''}
        <div class="step-files" style="margin-top:4px;">${chips}</div>
      </td>
      <td style="width:120px;">${status}</td>
      <td style="width:160px;text-align:right;">
        <div style="display:flex;gap:4px;justify-content:flex-end;">
          ${s.cmd ? `<button class="step-action-btn view" style="font-size:10px;padding:4px 8px;" onclick="toggleCmd('pcmd-${s.num}')">$ CMD</button>` : ''}
          <button class="step-action-btn ${btnClass}" onclick="handleStepAction('${action}','${s.name}')">${btnLabel}</button>
        </div>
      </td>
    </tr>`;

    const parentCmdRow = s.cmd ? _cmdRow(`pcmd-${s.num}`, `pcmd-${s.num}-code`, s.cmd, s.run_data||null) : '';

    const subRows = subs.map(ss => {
      const ssDone = ss.done;
      const ssViewable = ss.file && (ss.file.endsWith('.md') || ss.file.endsWith('.srt') || ss.file.endsWith('.json'));
      const cmdId  = `sscmd-${ss.id}`;
      const codeId = `${cmdId}-code`;
      return `
        <tr class="substep-row ${ssDone?'step-done':'step-pending'}" data-parent="${s.num}">
          <td style="width:40px;padding:5px 8px 5px 14px;">
            <div class="substep-num">${ss.num}</div>
          </td>
          <td style="padding:5px 12px;">
            <div style="font-size:12px;font-weight:600;color:var(--text);">${esc(ss.name)}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:1px;">
              → <code style="color:var(--teal);font-size:10px;">${esc(ss.file||'')}</code>
              <span style="margin-left:8px;opacity:.5;">needs: ${esc(ss.needs||'')}</span>
            </div>
            ${ss.id === '1_8' && ssDone && (phaseData?.cards||[]).length > 0 ? `
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
              ${(phaseData.cards).map(c => {
                const info = (phaseData.card_urls||{})[c]||{};
                const url = `${window.location.origin}${info.url||`/media/${PROJECT}/${PHASE}/infographic_assets/${c}`}`;
                return `<a href="${url}" target="_blank" style="font-size:10px;padding:1px 7px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--teal);text-decoration:none;font-family:'Courier New',monospace;">${c}</a>`;
              }).join('')}
            </div>` : ''}
          </td>
          <td style="width:120px;">
            ${ssDone ? '<span class="status-dot done" style="font-size:11px;">✅ Done</span>' : '<span class="status-dot pending" style="font-size:11px;">⬜ Pending</span>'}
          </td>
          <td style="width:160px;text-align:right;">
            <div style="display:flex;gap:4px;justify-content:flex-end;">
              <button class="step-action-btn view" style="font-size:10px;padding:3px 8px;" onclick="toggleCmd('${cmdId}')">$ CMD</button>
              ${ss.id === '1_8' && ssDone
                ? `<button class="step-action-btn preview" style="font-size:10px;padding:3px 8px;" onclick="openContentModal('tab:infographics','Infographic Cards')">🃏 View</button>`
                : ssViewable ? `<button class="step-action-btn view" style="font-size:10px;padding:3px 8px;" onclick="openContentModal('view:${ss.file}','${ss.name}')">👁</button>` : ''}
            </div>
          </td>
        </tr>
        ${ss.cmd ? _cmdRow(cmdId, codeId, ss.cmd, ss.run_data||null) : ''}`;
    }).join('');

    return parentRow + parentCmdRow + subRows;
  }).join('');

  return `<table class="pipeline-table">
    <thead><tr>
      <th style="width:40px;">#</th>
      <th>Step</th>
      <th>Status</th>
      <th style="text-align:right;width:160px;">Action</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ─────────────────────────────────────────────────
// CONTENT MODAL — universal pop-up viewer for any step output
// ─────────────────────────────────────────────────

function _fileIcon(ext) {
  return {md:'📄',srt:'💬',json:'⚙️',html:'🃏',mp3:'🎧',wav:'🎧',mp4:'🎬',png:'🖼️',jpg:'🖼️'}[ext] || '📁';
}

function _closeContentModal() {
  const el = document.getElementById('cm-backdrop');
  if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 150); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') _closeContentModal(); });

function _ensureBackdrop() {
  let el = document.getElementById('cm-backdrop');
  if (!el) {
    el = document.createElement('div');
    el.id = 'cm-backdrop';
    el.style.cssText = `
      position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,.78);backdrop-filter:blur(4px);
      z-index:8000;display:flex;align-items:center;justify-content:center;
      transition:opacity .15s;`;
    el.onclick = ev => { if (ev.target === el) _closeContentModal(); };
    document.body.appendChild(el);
  }
  el.style.opacity = '1';
  return el;
}

function _cmShell(headerHtml, bodyHtml, width = '900px') {
  return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;
                width:min(${width},95vw);max-height:90vh;overflow:hidden;
                display:flex;flex-direction:column;
                box-shadow:0 24px 80px rgba(0,0,0,.6);animation:fadeInOverlay .15s ease;">
      <div style="flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);">
        ${headerHtml}
      </div>
      <div style="flex:1;overflow-y:auto;">${bodyHtml}</div>
    </div>`;
}

async function openContentModal(action, stepName) {
  const bd = _ensureBackdrop();
  // Spinner while loading
  bd.innerHTML = _cmShell(
    `<div style="padding:14px 18px;font-size:13px;font-weight:700;color:var(--text);">Loading…</div>`,
    `<div style="display:flex;justify-content:center;padding:40px;">
       <div style="width:28px;height:28px;border:3px solid var(--border);
                   border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;"></div>
     </div>`
  );

  try {
    if (action === 'tab:infographics') {
      await _cmRenderCards(bd, stepName);
    } else if (action.startsWith('view:')) {
      await _cmRenderFile(bd, action.split(':')[1], stepName);
    } else {
      _closeContentModal();
      return;
    }
    // Log view to DB (best-effort, no await)
    fetch('/api/log-view', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({project:PROJECT, phase:PHASE, action, step_name:stepName})
    }).catch(() => {});
  } catch(e) {
    bd.innerHTML = _cmShell(
      `<div style="padding:14px 18px;display:flex;align-items:center;gap:10px;">
         <span style="font-size:13px;font-weight:700;color:var(--red);">Error</span>
         <button onclick="_closeContentModal()" style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:4px 10px;cursor:pointer;">✕</button>
       </div>`,
      `<div style="padding:20px;color:var(--red);font-size:12px;">${esc(e.message)}</div>`
    );
  }
}

async function _cmRenderFile(bd, filename, stepName) {
  const r = await fetch(`/api/file?project=${PROJECT}&phase=${PHASE}&file=${encodeURIComponent(filename)}`);
  if (!r.ok) throw new Error(`File not found: ${filename}`);
  const data = await r.json();
  const content  = data.content || '';
  const ext      = filename.split('.').pop().toLowerCase();
  const sizeKb   = (content.length / 1024).toFixed(1);
  const isHtml   = ext === 'html';
  const mediaUrl = `/media/${PROJECT}/${PHASE}/infographic_assets/${filename}`;
  const dlUrl    = `/media/${PROJECT}/${PHASE}/${filename}`;
  const tabId    = 'cm-body-' + Math.random().toString(36).slice(2);

  // View count badge from phaseData
  const vc = phaseData?.view_counts?.[filename];
  const viewBadge = vc ? `<span class="badge badge-blue" style="font-size:9px;">👁 ${vc} view${vc>1?'s':''}</span>` : '';

  const header = `
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;">
      <span style="font-size:18px;">${_fileIcon(ext)}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:700;color:var(--text);
                    font-family:'Courier New',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
          ${esc(filename)}
        </div>

async function _cmRenderCards(bd, stepName) {
  const cards     = phaseData?.cards    || [];
  const cardUrls  = phaseData?.card_urls|| {};
  if (!cards.length) throw new Error('No infographic cards found for this phase.');

  const tabButtons = cards.map((c, i) => `
    <button id="cm-tab-${i}" onclick="_cmSwitchCard(${i})"
            style="padding:8px 16px;background:${i===0?'var(--teal)':'var(--bg)'};
                   color:${i===0?'var(--bg)':'var(--text2)'};
                   border:1px solid ${i===0?'var(--teal)':'var(--border)'};
                   border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;
                   font-family:'Courier New',monospace;transition:all .15s;">
      ${esc(c)}
    </button>`).join('');

  const cardPanels = cards.map((c, i) => {
    const info = cardUrls[c] || {};
    const url  = info.url || `/media/${PROJECT}/${PHASE}/infographic_assets/${c}`;
    const siz  = info.size ? `${(info.size/1024).toFixed(0)} KB` : '';
    return `
      <div id="cm-card-${i}" style="display:${i===0?'block':'none'};">
        <div style="position:relative;width:100%;padding-top:56.25%;background:#0A0E1A;overflow:hidden;">
          <iframe src="${url}"
                  style="position:absolute;top:0;left:0;width:1080px;height:1080px;
                         transform-origin:top left;border:none;
                         transform:scale(calc(100vw * 0.85 / 1080));"
                  id="cm-iframe-${i}"></iframe>
        </div>
        <div style="padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);
                    display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);">
          <span>${esc(c)}</span><span>·</span><span>${siz}</span>
          <a href="${url}" target="_blank" class="step-action-btn view"
             style="margin-left:auto;font-size:10px;text-decoration:none;">Open full size ↗</a>
        </div>
      </div>`;
  }).join('');

  const header = `
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;">
      <span style="font-size:18px;">🃏</span>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;color:var(--text);">Infographic Cards</div>
        <div style="font-size:11px;color:var(--muted);">${cards.length} cards · ${esc(PROJECT)}/phase_${PHASE}</div>
      </div>
      <button onclick="_closeContentModal()" style="background:none;border:1px solid var(--border);
              border-radius:6px;color:var(--text2);padding:4px 10px;cursor:pointer;font-size:16px;line-height:1;">✕</button>
    </div>
    <div style="display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap;">${tabButtons}</div>`;

  bd.innerHTML = _cmShell(header,
    `<div style="background:#0A0E1A;">${cardPanels}</div>`,
    '1000px');

  // Scale iframes to fit
  requestAnimationFrame(() => {
    cards.forEach((_, i) => {
      const iframe = document.getElementById(`cm-iframe-${i}`);
      if (!iframe) return;
      const container = iframe.parentElement;
      const scale = container.offsetWidth / 1080;
      iframe.style.transform = `scale(${scale})`;
      iframe.style.height = `${1080 * scale}px`;
      container.style.paddingTop = `${1080 * scale}px`;
    });
  });
}

function _cmSwitchCard(idx) {
  // Hide all panels, show selected
  document.querySelectorAll('[id^="cm-card-"]').forEach((el, i) => {
    el.style.display = i === idx ? 'block' : 'none';
  });
  document.querySelectorAll('[id^="cm-tab-"]').forEach((btn, i) => {
    btn.style.background   = i === idx ? 'var(--teal)' : 'var(--bg)';
    btn.style.color        = i === idx ? 'var(--bg)'   : 'var(--text2)';
    btn.style.borderColor  = i === idx ? 'var(--teal)' : 'var(--border)';
  });
}

function handleStepAction(action, stepName) {
  // All "view" and "tab:infographics" actions → content modal
  if (action.startsWith('view:') || action === 'tab:infographics') {
    openContentModal(action, stepName);
    return;
  }
  if (action === 'run:video') {
    switchTab('video', document.querySelectorAll('.tab-btn')[6]);
    runToolCmd({project: PROJECT, phase: PHASE, cmd_type: 'create_video'});
  } else if (action === 'run:cuts') {
    switchTab('outputs', document.querySelectorAll('.tab-btn')[9]);
    runToolCmd({project: PROJECT, phase: PHASE, cmd_type: 'platform_cut'});
  } else if (action === 'run:text') {
    switchTab('outputs', document.querySelectorAll('.tab-btn')[9]);
    runToolCmd({project: PROJECT, phase: PHASE, cmd_type: 'text_content'});
  } else if (action === 'run:voiceover') {
    switchTab('audio', document.querySelectorAll('.tab-btn')[5]);
  } else if (action === 'run:publish') {
    switchTab('outputs', document.querySelectorAll('.tab-btn')[9]);
    runPhase();
  } else if (action.startsWith('run:')) {
    showToast(`Run pipeline to generate: ${stepName}`);
    runPhase();
  } else {
    showToast(`Open: ${stepName}`);
  }
}

function selectVoice(voiceId) {
  _selectedVoice = voiceId;
  localStorage.setItem(`voice_${PROJECT}_${PHASE}`, voiceId);
  // Re-render audio tab so the selector reflects the new selection
  const panel = document.getElementById('tab-audio');
  if (panel && phaseData) panel.innerHTML = renderAudio(phaseData);
}

async function generateVoiceover(voiceId) {
  const voice  = voiceId || _selectedVoice || 'en-IN-PrabhatNeural';
  // Use subtitles.srt as source if available (auto detects at server side)
  const hasSrt = (phaseData?.srt_segments?.length || 0) > 0;
  const source = hasSrt ? 'srt' : 'script';
  showToast(`Generating voiceover (${source}): ${voice}…`);
  await runToolCmd({
    project:  PROJECT,
    phase:    PHASE,
    cmd_type: 'tts',
    engine:   'edge',
    voice,
    source,
  });
  // Refresh audio tab after generation
  setTimeout(async () => {
    const rd = await fetch(`/api/phase-data?project=${PROJECT}&phase=${PHASE}`);
    if (rd.ok) {
      phaseData = await rd.json();
      const panel = document.getElementById('tab-audio');
      if (panel) panel.innerHTML = renderAudio(phaseData);
    }
  }, 3000);
}

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;

    const genCmdMap = {

      tiktok:         `python tools/platform_cutter.py --project ${proj} --phase ${ph} --video _output/phase_${padPh}/youtube/final_1080p.mp4`,
      instagram:      `python tools/platform_cutter.py --project ${proj} --phase ${ph} --video _output/phase_${padPh}/youtube/final_1080p.mp4`,
      twitter:        `python tools/text_content_generator.py --project ${proj} --phase ${ph}`,
      linkedin:       `python tools/text_content_generator.py --project ${proj} --phase ${ph}`,
      blog:           `python tools/text_content_generator.py --project ${proj} --phase ${ph}`,
      github:         `python tools/text_content_generator.py --project ${proj} --phase ${ph}`,
    };
    const runCmdTypeMap = {
      youtube: 'create_video', youtube_shorts: 'create_video',
      tiktok: 'platform_cut', instagram: 'platform_cut',
      twitter: 'text_content', linkedin: 'text_content',
      blog: 'text_content', github: 'text_content',
    };
    const genCmd = genCmdMap[slug] || '';

            <button class="step-action-btn view" style="font-size:10px;padding:2px 7px;"

          </div>
        </div>
        <code style="font-size:10px;color:var(--teal);word-break:break-all;">${esc(genCmd)}</code>

    // Inline video preview (thumbnail-size)
    const inlinePlayer = videoFile ? `
      <div style="background:#000;border-bottom:1px solid var(--border);">

    return `

const _outputPreviewCache = {};
async function toggleOutputPreview(slug, fileIdx, project, phase, path) {
  const id = `op-${slug}-${fileIdx}`;
  const el = document.getElementById(id);
  if (!el) return;
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (_outputPreviewCache[id]) { el.innerHTML = _outputPreviewCache[id]; return; }
  el.innerHTML = '<div style="color:var(--muted);font-size:11px;padding:6px;">Loading…</div>';
  try {
    const r = await fetch(`/api/output-text?project=${project}&phase=${phase}&path=${encodeURIComponent(path)}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error||r.status);
    const codeId = `opc-${slug}-${fileIdx}`;
    const html = `
      <div style="padding-top:8px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:10px;color:var(--muted);">${esc(data.filename)} · ${(data.size/1024).toFixed(1)} KB</span>
          <button class="copy-content-btn" onclick="navigator.clipboard.writeText(document.getElementById('${codeId}').textContent).then(()=>showToast('Copied!'))">📋 Copy</button>
        </div>
        <pre id="${codeId}" style="background:#06090F;border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:11px;color:#8A97B0;white-space:pre-wrap;max-height:220px;overflow-y:auto;margin:0;">${esc(data.content)}</pre>
      </div>`;
    _outputPreviewCache[id] = html;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red);font-size:11px;padding:6px;">Error: ${e.message}</div>`;
  }
}

function renderContext(d) {
  const b   = d.brand        || {};

  const clr = b.colors       || {};
  const tone= b.tone_of_voice|| {};
  const typo= b.typography   || {};
  const snd = b.sound_identity|| {};

  // ── Color swatches
  const swatches = Object.values(clr).map(c => `
    <div style="display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid rgba(30,42,66,.5);">
      <div style="width:22px;height:22px;border-radius:5px;background:${esc(c.hex)};border:1px solid rgba(255,255,255,.12);flex-shrink:0;"></div>

      <span style="font-size:10px;color:var(--muted);">${esc(c.usage)}</span>
    </div>`).join('') || '<div style="color:var(--muted);font-size:12px;">No colors defined</div>';

  // ── Content breakdown
  const breakdown = (rp.content_breakdown || []).map(cb => {
    const desc = cb.type==='long-form'   ? `${cb.duration_min}-min video`
               : cb.type==='short-form'  ? `${cb.duration_min}-min cut`

               : cb.type==='article'     ? `${cb.words} words`

function copyPromptContext() {
  const d   = phaseData;
  const b   = d.brand         || {};
  const rp  = d.roadmap_phase || {};
  const tone= b.tone_of_voice || {};
  const typo= b.typography    || {};
  const clr = b.colors        || {};
  const snd = b.sound_identity|| {};

  const lines = [
    `====== BRAND CONTEXT: ${b.brand_name||d.project} ======`,
    `Tagline: ${b.tagline||'—'}`,
    `Niche: ${b.niche||'—'}`,
    `Target Audience: ${b.target_audience||'—'}`,
    '',
    `PHASE ${d.phase} — TOPIC: ${rp.title||d.title}`,
    '',
    'LEARNING GOALS:',
    ...(rp.learning_goals||[]).map(g => `  - ${g}`),
    '',
    'CONTENT OUTPUT REQUIRED:',
    ...(rp.content_breakdown||[]).map(cb => {
      const desc = cb.type==='long-form'   ? `${cb.duration_min}-minute video`
                 : cb.type==='short-form'  ? `${cb.duration_min}-minute short cut`
                 : cb.type==='infographic' ? `${cb.card_count} infographic cards`
                 : cb.type==='article'     ? `${cb.words}-word article`
                 : cb.type==='thread'      ? `${cb.tweets}-tweet thread`
                 : cb.type;
      return `  - ${cb.platform}: ${desc}`;
    }),
    '',
    'TONE OF VOICE:',
    `  Primary: ${tone.primary||'—'}`,
    `  Sentence Style: ${tone.sentence_style||'—'}`,
    tone.analogy_style ? `  Analogy Style: ${tone.analogy_style}` : null,
    `  Forbidden Words: ${(tone.forbidden_words||[]).join(', ')||'none'}`,
    '',
    'BRAND COLORS:',
    ...Object.values(clr).map(c => `  - ${c.name} (${c.hex}): ${c.usage}`),
    '',
    'TYPOGRAPHY:',
    typo.heading_font ? `  Heading Font: ${typo.heading_font} (min ${typo.min_header_size_px||72}px)` : null,
    typo.body_font    ? `  Body Font: ${typo.body_font} (min ${typo.min_body_size_px||48}px)` : null,
    typo.max_words_per_line ? `  Max words per line on cards: ${typo.max_words_per_line}` : null,
    '',
    'CONTENT PILLARS:',
    ...(b.content_pillars||[]).map((p,i) => `  ${i+1}. ${p}`),
  ];

  if (snd.intro_music_style) {
    lines.push('', 'SOUND IDENTITY:',
      `  Music: ${snd.intro_music_style}`,
      `  BPM: ${snd.bpm_range||'—'}`,
      `  Mood: ${(snd.mood_keywords||[]).join(', ')}`,
      `  Avoid: ${(snd.forbidden_genres||[]).join(', ')}`);
  }
  lines.push('', '====== END CONTEXT ======');

  const text = lines.filter(l => l !== null).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast('✅ Prompt context copied!'));
}

        <button class="copy-content-btn" onclick="copyFileContent('${id}')">📋 Copy</button>
      </div>
      <div class="file-content" id="fvc-${id}">
        <div style="color:var(--muted);text-align:center;padding:40px;">
          <div style="font-size:24px;margin-bottom:8px;">📄</div>
          Click to load

        </div>

const _editorFiles = {};

async function loadFileContent(filename, id) {
  const container = document.getElementById(`fvc-${id}`);
  if (!container) return;
  container._loading = true;
  container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);">Loading…</div>';
  try {
    const r = await fetch(`/api/file?project=${PROJECT}&phase=${PHASE}&file=${encodeURIComponent(filename)}`);
    if (r.status === 404) {
      container._loading = false;
      renderEditor(container, filename, id, false);
      return;
    }
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    container._rawContent = data.content;
    container._editorMode = false;
    container._loading = false;
    const szEl = document.getElementById(`fvsz-${id}`);
    if (szEl) szEl.textContent = (data.content.length/1024).toFixed(1) + ' KB';
    container.innerHTML = colorize(data.content, data.type, filename);
    const editBtn = document.getElementById(`fvedit-${id}`);
    if (editBtn) editBtn.style.display = '';
  } catch(e) {
    container._loading = false;
    container.innerHTML = `<div style="color:var(--red);padding:20px;">Error: ${e.message}</div>`;
  }
}

function editTabFile(filename, id) {
  const container = document.getElementById(`fvc-${id}`);
  if (!container) return;
  renderEditor(container, filename, id, false, container._rawContent || '');
}

function copyFileContent(id) {
  const el = document.getElementById(`fvc-${id}`);
  if (!el) return;
  const text = el._rawContent || el.textContent;
  navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
}

function scaleIframes() {
  const cards = phaseData?.cards || [];
  cards.forEach((_, i) => {
    const wrap = document.getElementById(`cfc-${i}`);
    const frame = document.getElementById(`cfi-${i}`);
    if (!wrap || !frame) return;
    const scale = wrap.offsetWidth / 1080;
    frame.style.transform = `scale(${scale})`;
    wrap.style.paddingTop = `${wrap.offsetWidth}px`;
  });

function renderVoiceoverVersions(d) {
  const sv = d.step_versions || {};
  const versions = sv.voiceover || [];
  if (!versions.length) return '';

  const rows = versions.map(v => {
    const date   = v.ts ? new Date(v.ts * 1000).toLocaleString() : '—';
    const files  = v.files || [];
    const mp3s   = files.filter(f => /\.(mp3|wav|ogg)$/i.test(f.name));

    return `
      <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;
                  border-bottom:1px solid rgba(30,42,66,.4);
                  background:${v.version === versions[0].version ? 'var(--teal-dim)' : 'transparent'};">
        <span style="width:32px;height:32px;border-radius:8px;flex-shrink:0;
                     background:${v.version===versions[0].version?'var(--teal)':'var(--border)'};
                     color:${v.version===versions[0].version?'var(--bg)':'var(--muted)'};
                     font-size:12px;font-weight:800;display:flex;align-items:center;
                     justify-content:center;font-family:'Space Grotesk',sans-serif;">
          v${v.version}
        </span>
        <div style="flex:1;min-width:0;">
          ${mp3s.map(f => `
            <div style="font-size:12px;color:var(--text);font-weight:600;">${esc(f.name)}</div>
            <div style="font-size:10px;color:var(--muted);">${f.size_mb} MB</div>`).join('') ||
            `<div style="font-size:11px;color:var(--muted);">${files.length} file${files.length!==1?'s':''}</div>`}
        </div>
        <div style="font-size:10px;color:var(--muted);flex-shrink:0;text-align:right;">
          ${v.version === versions[0].version ? '<span class="badge badge-teal" style="font-size:8px;margin-bottom:3px;display:block;">LATEST</span>' : ''}
          🕐 ${date}
        </div>
      </div>`;
  }).join('');

  return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;
                overflow:hidden;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;
                  background:var(--bg2);border-bottom:1px solid var(--border);">
        <span style="font-size:14px;">📁</span>
        <div style="font-size:12px;font-weight:700;color:var(--text);">
          Voiceover Versions
          <span class="badge badge-blue" style="font-size:9px;margin-left:6px;">${versions.length} saved</span>
        </div>
        <button onclick="showVersionHistory('voiceover')"
                style="margin-left:auto;background:none;border:1px solid var(--border);
                       border-radius:6px;color:var(--text2);font-size:11px;
                       padding:3px 9px;cursor:pointer;font-family:inherit;">
          View all →
        </button>
      </div>
      <div>${rows}</div>
    </div>`;
}

      <div style="background:#06090F;border:1px solid var(--border);border-radius:5px;padding:8px 10px;display:flex;align-items:flex-start;gap:8px;">
        <code style="font-size:10px;color:var(--teal);flex:1;white-space:pre-wrap;">${esc(t.cmd)}</code>
        <button class="step-action-btn view" style="font-size:10px;padding:2px 7px;flex-shrink:0;"
                onclick="navigator.clipboard.writeText(${JSON.stringify(t.cmd)}).then(()=>showToast('Command copied!'))">📋</button>
      </div>
    </div>`).join('');

  // ── No audio yet ──────────────────────────────────────────────────────────
  if (!files.length) {
    return `
      <!-- Input Segments -->
      ${renderSrtSegments(d)}

      <!-- Voice Selector -->
      ${renderVoiceSelector()}

      <!-- Browser TTS preview bar -->
      <div style="background:var(--bg2);border:1px solid var(--teal);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">

  // ── Audio files found — show players ────────────────────────────────────
  const uploadBar = `

  return `

      <summary style="cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);list-style:none;display:flex;align-items:center;gap:6px;">

let _inlineRaw = '';
async function viewFile(filename) {
  const viewer = document.getElementById('inline-viewer');
  if (!viewer) return;
  viewer.style.display = 'block';
  document.getElementById('iv-name').textContent = filename;
  // Clear old dynamic edit button
  const oldEb = document.getElementById('iv-edit-btn-dyn');
  if (oldEb) oldEb.remove();

  const ivContent = document.getElementById('iv-content');
  ivContent.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);">Loading…</div>';
  try {
    const r = await fetch(`/api/file?project=${PROJECT}&phase=${PHASE}&file=${encodeURIComponent(filename)}`);
    if (r.status === 404) {
      ivContent._editorMode = true;
      renderEditor(ivContent, filename, 'inline', true);
      viewer.scrollIntoView({behavior:'smooth'});
      return;
    }
    const data = await r.json();
    _inlineRaw = data.content;
    ivContent._rawContent = data.content;
    ivContent._editorMode = false;
    document.getElementById('iv-size').textContent = (data.content.length/1024).toFixed(1)+' KB';
    ivContent.innerHTML = colorize(data.content, data.type, filename);
    viewer.scrollIntoView({behavior:'smooth'});
    // Add dynamic Edit button
    const hdr = viewer.querySelector('.file-viewer-header');
    if (hdr) {
      const eb = document.createElement('button');
      eb.id = 'iv-edit-btn-dyn';
      eb.className = 'copy-content-btn';
      eb.textContent = '✏️ Edit';
      eb.style.marginRight = '4px';
      eb.onclick = () => renderEditor(ivContent, filename, 'inline', true, _inlineRaw);
      hdr.insertBefore(eb, hdr.querySelector('.copy-content-btn'));
    }
  } catch(e) {
    ivContent.innerHTML = `<span style="color:var(--red);">Error: ${e.message}</span>`;
  }
}
function closeInlineViewer() { document.getElementById('inline-viewer').style.display='none'; }
function copyInlineContent() { navigator.clipboard.writeText(_inlineRaw).then(()=>showToast('Copied!')); }

const _FILE_PLACEHOLDERS = {
  'script.md':          '# Script\n\n## Introduction\n\nWrite your full narration script here...\n',
  'script_short.md':    '# Short Script (60 seconds)\n\nWrite your short-form TikTok/Reels cut here...\n',
  'voiceover_brief.md': '# Voiceover Brief\n\nPacing notes, emphasis cues, and TTS guidance...\n',
  'clip_brief.md':      '# Clip Brief\n\n## Shot 1\n\nDescribe each shot and b-roll here...\n',
  'music_brief.md':     '# Music Brief\n\nMood, tempo, and style notes for background music...\n',
  'subtitles.srt':      '1\n00:00:00,000 --> 00:00:04,000\nSubtitle text here\n',
};

function renderEditor(container, filename, id, isInline, existingContent) {
  _editorFiles[id] = filename;
  container._editorMode = true;
  container._rawContent = null;
  const isNew = (existingContent === undefined || existingContent === null);
  const initial = isNew ? (_FILE_PLACEHOLDERS[filename] || '') : existingContent;
  const labelHtml = isNew
    ? `<span style="color:var(--gold);">⚠️</span> <strong>${esc(filename)}</strong> not found — create it below:`
    : `<span style="color:var(--blue);">✏️</span> Editing <strong>${esc(filename)}</strong>`;
  container.innerHTML = `
    <div style="padding:14px;">
      <div class="file-editor-label">${labelHtml}</div>
      <textarea id="editor-${id}" class="file-editor-textarea" rows="18"></textarea>
      <div class="file-editor-bar">
        <span id="editor-status-${id}" class="file-editor-status"></span>
        ${!isNew ? `<button class="step-action-btn view" style="background:var(--card);" onclick="cancelEdit('${id}',${isInline})">✕ Cancel</button>` : ''}
        <button class="step-action-btn run" onclick="saveFileContent('${id}',${isInline})">💾 Save</button>
      </div>
    </div>`;
  const ta = document.getElementById(`editor-${id}`);
  if (ta) {
    ta.value = initial;
    if (isNew) { ta.focus(); ta.select(); }
  }
}

async function saveFileContent(id, isInline) {
  const filename = _editorFiles[id];
  if (!filename) return;
  const ta = document.getElementById(`editor-${id}`);
  if (!ta) return;
  const content = ta.value;
  const statusEl = document.getElementById(`editor-status-${id}`);
  if (statusEl) { statusEl.textContent = 'Saving…'; statusEl.style.color = 'var(--gold)'; }
  try {
    const r = await fetch('/api/save-file', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ project: PROJECT, phase: PHASE, filename, content })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    showToast(`✅ ${filename} saved!`);
    delete _editorFiles[id];
    if (isInline) {
      const c = document.getElementById('iv-content');
      if (c) { c._editorMode = false; c._loading = false; }
      await viewFile(filename);
    } else {
      const c = document.getElementById(`fvc-${id}`);
      if (c) { c._editorMode = false; c._loading = false; }
      await loadFileContent(filename, id);
    }
    refreshPipelineSteps();
  } catch(e) {
    if (statusEl) { statusEl.textContent = `Error: ${e.message}`; statusEl.style.color = 'var(--red)'; }
    showToast(`❌ Save failed: ${e.message}`);
  }
}

function cancelEdit(id, isInline) {
  const filename = _editorFiles[id];
  if (!filename) return;
  delete _editorFiles[id];
  if (isInline) {
    const c = document.getElementById('iv-content');
    if (c) { c._editorMode = false; c._loading = false; }
    viewFile(filename);
  } else {
    const c = document.getElementById(`fvc-${id}`);
    if (c) { c._editorMode = false; c._loading = false; }
    loadFileContent(filename, id);
  }
}

async function refreshPipelineSteps() {
  try {
    const r = await fetch(`${API}/api/phase-data?project=${PROJECT}&phase=${PHASE}`);
    if (!r.ok) return;
    const d = await r.json();
    phaseData = d;
    const pct = Math.round((d.steps_done / d.steps_total) * 100);
    const fill = document.querySelector('.progress-fill');
    if (fill) fill.style.width = pct + '%';
    const lbl = document.querySelector('.progress-label');
    if (lbl) lbl.textContent = `Pipeline progress — ${pct}% complete`;
    // Update meta chips
    const chips = document.querySelectorAll('.meta-chip');
    if (chips[1]) chips[1].textContent = `📁 ${d.files.length} files`;
    if (chips[3]) chips[3].textContent = `📋 ${d.steps_done}/${d.steps_total} steps done`;
    // Re-render pipeline table
    const tblParent = document.querySelector('.pipeline-table')?.parentElement;
    if (tblParent) tblParent.innerHTML = renderPipelineTable(d.pipeline_steps);
  } catch(e) { /* silent */ }
}

// ─────────────────────────────────────────────────
// COLORIZE FILE CONTENT
// ─────────────────────────────────────────────────
function colorize(content, type, filename) {
  if (type === 'json') {
    try {
      const pretty = JSON.stringify(JSON.parse(content), null, 2);
      return `<span class="json">${esc(pretty)}</span>`;
    } catch { return esc(content); }
  }
  if (type === 'srt') {
    return content.split('\n').map(line => {
      if (/^\d+$/.test(line.trim())) return `<span class="srt-idx">${esc(line)}</span>`;
      if (line.includes('-->'))       return `<span class="srt-ts">${esc(line)}</span>`;
      return esc(line);
    }).join('\n');
  }
  // markdown / text
  return content.split('\n').map(line => {
    if (/^# /.test(line))   return `<span class="md-h1">${esc(line)}</span>`;
    if (/^## /.test(line))  return `<span class="md-h2">${esc(line)}</span>`;
    if (/^### /.test(line)) return `<span class="md-h3">${esc(line)}</span>`;
    return esc(line).replace(/`([^`]+)`/g, '<span class="md-code">$1</span>');
  }).join('\n');
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cssId(s) { return s.replace(/[^a-zA-Z0-9]/g,'_'); }

// ─────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    document.querySelectorAll('.tab-btn').forEach(b => {
      if (b.getAttribute('onclick')?.includes(`'${id}'`)) b.classList.add('active');
    });
  }
  const panel = document.getElementById('tab-' + id);
  if (panel) panel.classList.add('active');

  // Auto-load file content for file tabs (skip if editor already shown or in flight)
  const autoLoad = { script:'script.md', short:'script_short.md', srt:'subtitles.srt', compliance:'compliance_report_auto.md' };
  if (autoLoad[id]) {
    const fid = cssId(autoLoad[id]);
    const el = document.getElementById(`fvc-${fid}`);
    if (el && !el._rawContent && !el._loading && !el._editorMode) {
      el._loading = true;
      loadFileContent(autoLoad[id], fid);
    }
  }
}

async function uploadClip(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('project',  PROJECT);
  fd.append('phase',    String(PHASE));
  fd.append('filename', file.name);
  fd.append('video',    file);
  showToast(`Uploading ${file.name}…`);
  try {
    const r = await fetch('/api/upload-clip', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    showToast(`✅ Clip uploaded: ${file.name} (${data.size_mb} MB)`);
    const rd = await fetch(`/api/phase-data?project=${PROJECT}&phase=${PHASE}`);
    if (rd.ok) { phaseData = await rd.json(); }
    const panel = document.getElementById('tab-video');
    if (panel && phaseData) panel.innerHTML = renderVideo(phaseData);
  } catch(e) {
    showToast(`❌ Upload failed: ${e.message}`);
  }
  input.value = '';
}

    showToast('Browser TTS not supported in this browser — try Chrome or Edge');
    return;
  }
  window.speechSynthesis.cancel();

  // Load script.md content
  let text = '';
  try {
    const r = await fetch(`/api/file?project=${PROJECT}&phase=${PHASE}&file=script.md`);
    if (!r.ok) throw new Error('script.md not found');
    const data = await r.json();
    // Extract NARRATION: / SPOKEN: sections
    const lines = data.content.split('\n');
    const spoken = [];
    let inSpoken = false;
    for (const line of lines) {
      const s = line.trim();
      if (/^(NARRATION|SPOKEN)\s*:/i.test(s)) {
        inSpoken = true;
        const remainder = s.replace(/^(NARRATION|SPOKEN)\s*:\s*/i, '');
        if (remainder) spoken.push(remainder);
        continue;
      }
      if (/^#{1,4}\s/.test(s) || s.startsWith('[') || s.startsWith('ON-SCREEN') ||
          (s.startsWith('**') && s.includes(':'))) {
        inSpoken = false;
        continue;
      }
      if (inSpoken && s) spoken.push(s);
    }
    text = spoken.join(' ') || data.content.replace(/[#*`\[\]]/g, '').slice(0, 3000);
  } catch(e) {
    showToast(`Could not load script: ${e.message}`);
    return;
  }

  _speechUtterance = new SpeechSynthesisUtterance(text);
  _speechUtterance.rate  = 0.95;
  _speechUtterance.pitch = 1.0;
  _speechUtterance.lang  = 'en-US';
  // Pick a good voice if available
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name.includes('Google US English') ||
                                      v.name.includes('Microsoft Zira') ||
                                      v.name.includes('Samantha') ||
                                      (v.lang === 'en-US' && !v.localService));
  if (preferred) _speechUtterance.voice = preferred;

  _speechUtterance.onend   = () => { _updatePreviewBtns(false); };
  _speechUtterance.onerror = () => { _updatePreviewBtns(false); };
  window.speechSynthesis.speak(_speechUtterance);
  _updatePreviewBtns(true);
  showToast('Playing script via browser TTS…');
}

function browserPreviewStop() {
  window.speechSynthesis.cancel();
  _updatePreviewBtns(false);
}

function _updatePreviewBtns(playing) {
  const play = document.getElementById('btn-preview-play');
  const stop = document.getElementById('btn-preview-stop');
  if (play) play.style.display = playing ? 'none' : '';
  if (stop) stop.style.display = playing ? '' : 'none';
}

function streamJob(job_id) {
  const es = new EventSource(`/api/jobs/${job_id}/stream`);
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.ping) return;
    if (d.line) appendMiniAuto(d.line);
    if (d.done) {
      es.close();
      const ok = d.status === 'done';
      appendMini(ok ? '\n✅ Done!\n' : '\n❌ Failed\n', ok ? 't-teal' : 't-red');
      document.getElementById('mini-badge').textContent = ok ? 'DONE' : 'FAILED';
      document.getElementById('mini-badge').style.color = ok ? 'var(--teal)' : 'var(--red)';
      if (ok) {
        // Refresh phase data and update Outputs tab without full page reload
        setTimeout(async () => {
          try {
            const r = await fetch(`/api/phase-data?project=${PROJECT}&phase=${PHASE}`);
            if (r.ok) {
              phaseData = await r.json();
              // Update pipeline table + progress
              refreshPipelineSteps();
              // Update Outputs tab if it's active
              const outPanel = document.getElementById('tab-outputs');
              if (outPanel) outPanel.innerHTML = renderOutputs(phaseData);
              // Switch to Outputs tab to show results
              const outBtn = document.querySelector('.tab-btn[onclick*="outputs"]');
              if (outBtn) switchTab('outputs', outBtn);
            }
          } catch(e) { location.reload(); }
        }, 1200);
      }
    }
  };
}

function appendMini(text, cls) {
  const body = document.getElementById('mini-body');
  if (!body) return;
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = text;
  body.appendChild(s);
  body.scrollTop = body.scrollHeight;
}
function appendMiniAuto(line) {
  const l = line.toLowerCase();
  let cls = '';
  if (l.includes('error') || l.includes('fail'))     cls = 't-red';
  else if (l.includes('✓') || l.includes('pass'))    cls = 't-teal';
  else if (l.includes('step') || l.includes('▶'))    cls = 't-gold';
  else if (l.includes('[warn]') || l.includes('─'))  cls = 't-dim';
  appendMini(line, cls);
}

// ─────────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('resize', scaleIframes);
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

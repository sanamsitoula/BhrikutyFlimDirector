<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tools & Pipeline — Bhrikuty</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0E1A;--bg2:#0F1525;--card:#141B2D;--card2:#1A2238;--border:#1E2A42;--teal:#00D4AA;--teal-dim:rgba(0,212,170,.12);--gold:#F5A623;--gold-dim:rgba(245,166,35,.12);--red:#FF4D6A;--red-dim:rgba(255,77,106,.12);--blue:#4D94FF;--blue-dim:rgba(77,148,255,.12);--purple:#A855F7;--green:#22C55E;--green-dim:rgba(34,197,94,.12);--text:#E8EDF5;--text2:#8A97B0;--muted:#4A5568;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600;}
::-webkit-scrollbar{width:5px;height:5px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
/* NAV */
.topnav{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;flex-wrap:wrap;}
.brand-text h1{font-size:16px;color:var(--text);}
.nav-links{display:flex;gap:4px;margin-left:auto;}
.nav-link{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text2);text-decoration:none;transition:all .2s;}
.nav-link:hover,.nav-link.active{background:var(--teal-dim);color:var(--teal);}
.server-badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,.3);}
.server-badge.online{background:var(--green-dim);color:var(--green);border-color:rgba(34,197,94,.3);}
/* LAYOUT */
.page{max-width:1400px;margin:0 auto;padding:24px;}
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
.page-title{font-size:24px;color:var(--text);}
.page-sub{font-size:13px;color:var(--text2);margin-top:3px;}
/* TABS */
.cat-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none;}
.cat-tab{display:flex;align-items:center;gap:6px;padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap;margin-bottom:-1px;}
.cat-tab:hover{color:var(--text);}
.cat-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.cat-panel{display:none;} .cat-panel.active{display:block;}
/* TOOL GRID */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s;}
.tool-card:hover{border-color:var(--teal);}
.tool-card.configured{border-color:rgba(0,212,170,.4);}
.tool-card-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);background:var(--bg2);}
.tool-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.tool-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--teal-dim);}
.tool-name{font-size:14px;font-weight:700;color:var(--text);}
.tool-type{font-size:10px;color:var(--muted);}
.tool-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.badge{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.04em;}
.badge-teal{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,170,.3);}
.badge-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,166,35,.3);}
.badge-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,.3);}
.badge-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(77,148,255,.3);}
.badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.badge-purple{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.3);}
/* Rating bar */
.rating-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.rating-bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.rating-fill{height:100%;border-radius:2px;background:linear-gradient(to right,var(--teal),#00EDBC);}
.rating-val{font-size:11px;font-weight:700;color:var(--teal);width:28px;text-align:right;}
.tool-body{padding:12px 16px;}
.tool-cost{font-size:11px;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.tool-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
.tool-outputs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.output-chip{padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;font-size:10px;color:var(--text2);}
.tool-footer{display:flex;gap:8px;align-items:center;padding-top:10px;border-top:1px solid var(--border);}
.cmd-snippet{flex:1;background:#06090F;border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-family:'Courier New',monospace;font-size:10px;color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s;}
.btn-teal{background:var(--teal);color:var(--bg);}
.btn-teal:hover{background:#00EDBC;}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text2);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
.btn-sm{padding:4px 10px;font-size:11px;}
/* Status */
.status-dot{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;}
.status-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;display:block;}
.status-ok{color:var(--green);}
.status-warn{color:var(--gold);}
.status-no{color:var(--muted);}
/* Terminal */
.mini-term{background:#06090F;border:1px solid var(--teal);border-radius:8px;margin-top:10px;overflow:hidden;display:none;}
.mini-term.open{display:block;}
.mini-term-head{padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);}
.mini-term-body{padding:10px 12px;font-family:'Courier New',monospace;font-size:11px;line-height:1.6;color:#8A97B0;max-height:180px;overflow-y:auto;}
/* Platform grid */
.platform-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:24px;}
.plat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.plat-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plat-icon{font-size:22px;}
.plat-specs{display:flex;flex-direction:column;gap:3px;}
.spec-row{display:flex;gap:6px;flex-wrap:wrap;}
.spec-chip{padding:1px 7px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:10px;color:var(--text2);font-family:'Courier New',monospace;}
/* Tool output comparison */
.compare-row{display:grid;grid-template-columns:120px 1fr;gap:0;margin-bottom:1px;}
.compare-label{background:var(--bg2);padding:8px 12px;font-size:11px;color:var(--text2);border:1px solid var(--border);}
.compare-cells{display:flex;gap:0;}
.compare-cell{flex:1;padding:8px 10px;font-size:11px;border:1px solid var(--border);text-align:center;}
.compare-good{color:var(--green);}
.compare-ok{color:var(--gold);}
.compare-no{color:var(--muted);}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--teal);border-radius:8px;padding:10px 16px;font-size:12px;font-weight:500;color:var(--teal);z-index:9999;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>

  <!-- Panel: Thumbnails -->

  <!-- Panel: Infographic AI -->

  <!-- Panel: Compare All -->

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let toolsStatus = {};
let currentProject = '';
let currentPhase   = 1;
let currentCat     = 'video';
const activeTerms  = {};

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
async function init() {
  // Load tools status
  try {
    const r = await fetch('/api/tools-status');
    if (r.ok) toolsStatus = await r.json();
  } catch(e) {}

  // Load projects
  try {
    const r = await fetch('/api/projects');
    if (r.ok) {
      const projects = await r.json();
      const sel = document.getElementById('sel-project');
      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
      if (projects.length) {
        sel.value = projects[0].name;
        currentProject = projects[0].name;
        // Populate phases
        const phases = projects[0].phases || [];
        const selPhase = document.getElementById('sel-phase');
        selPhase.innerHTML = phases.map((ph,i) =>
          `<option value="${i+1}">Phase ${i+1}</option>`).join('') || '<option value="1">Phase 1</option>';
        currentPhase = 1;
      }
    }
  } catch(e) {}

  renderAll();
}

function onProjectChange() {
  currentProject = document.getElementById('sel-project').value;
  currentPhase   = parseInt(document.getElementById('sel-phase').value) || 1;
  renderAll();
}

function renderAll() {
  currentProject = document.getElementById('sel-project').value;
  currentPhase   = parseInt(document.getElementById('sel-phase').value) || 1;
  ['video','audio','subtitle','thumbnail','image','publish'].forEach(cat => {
    const el = document.getElementById(`tools-${cat}`);
    if (el) el.innerHTML = renderCategory(cat);
  });
  const cmp = document.getElementById('tools-compare');
  if (cmp) cmp.innerHTML = renderCompare();
}

// ═══════════════════════════════════════════════════
// CATEGORY RENDER
// ═══════════════════════════════════════════════════
function renderCategory(cat) {
  const tools = TOOLS[cat] || [];
  const cards = tools.map(t => renderToolCard(t)).join('');
  return `<div class="tools-grid">${cards}</div>`;
}

function isConfigured(tool) {
  if (tool.local) return true;  // local tools assumed available
  if (!tool.env_key) return true; // no key needed → available
  // Check from tools-status API
  for (const cat of Object.values(toolsStatus)) {
    if (Array.isArray(cat)) {
      const found = cat.find(t => t.id && tool.id.startsWith(t.id));
      if (found) return found.configured;
    }
  }
  return false;
}

function renderToolCard(t) {
  const configured = isConfigured(t);
  const ratingPct  = (t.rating / 10) * 100;

  const typeBadgeCls = {
    'Free':'badge-teal','Free/CPU':'badge-teal','Free/GPU':'badge-blue',
    'Freemium':'badge-gold','Paid':'badge-red','Open Source':'badge-green',
    'Built-in':'badge-purple',
  }[t.type] || 'badge-blue';

  const statusEl = configured
    ? `<span class="status-dot status-ok">Ready</span>`
    : (t.env_key
      ? `<span class="status-dot status-warn">Set ${t.env_key} in .env</span>`
      : `<span class="status-dot status-no">Install required</span>`);

  const tryCmd = t.try_cmd
    ? t.try_cmd.replace('{project}', currentProject || 'ecoWorld')
               .replace('{phase}',   String(currentPhase || 1))
    : null;

  const outputs = (t.outputs || []).map(o =>
    `<span class="output-chip">${o}</span>`).join('');

  const docsBtn = t.docs
    ? `<a href="${t.docs}" target="_blank" class="btn btn-ghost btn-sm">Docs ↗</a>`
    : '';

  const tryBtn = tryCmd
    ? `<button class="btn btn-teal btn-sm" onclick="tryTool('${t.id}','${esc(tryCmd)}')">⚡ Try</button>`
    : `<button class="btn btn-ghost btn-sm" disabled style="opacity:.4;">⚡ Try</button>`;

  return `
    <div class="tool-card ${configured?'configured':''}" id="card-${t.id}">
      <div class="tool-card-head">
        <div class="tool-top">
          <div class="tool-icon">${t.icon}</div>
          <div style="flex:1;">
            <div class="tool-name">${t.name}</div>
            <div class="tool-type">${t.category?.toUpperCase()} TOOL</div>
            <div class="tool-badges" style="margin-top:5px;">
              <span class="badge ${typeBadgeCls}">${t.type}</span>
              ${statusEl}
            </div>
          </div>
        </div>
        <div class="rating-row">
          <div class="rating-bar-wrap"><div class="rating-fill" style="width:${ratingPct}%"></div></div>
          <span class="rating-val">${t.rating}</span>
        </div>
      </div>
      <div class="tool-body">
        <div class="tool-cost">💰 ${t.cost}</div>
        <div class="tool-desc">${t.desc}</div>
        <div class="tool-outputs">${outputs}</div>
        <div class="tool-footer">
          <code class="cmd-snippet" title="${esc(t.install)}">${esc(t.install)}</code>
          <button class="btn btn-ghost btn-sm" onclick="copyInstall('${esc(t.install)}')">📋</button>
          ${docsBtn}
          ${tryBtn}
        </div>
        <div class="mini-term" id="term-${t.id}">
          <div class="mini-term-head">
            <span>Pipeline Output — ${t.name}</span>
            <button onclick="document.getElementById('term-${t.id}').classList.remove('open')" style="margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;">✕</button>
          </div>
          <div class="mini-term-body" id="term-body-${t.id}"></div>
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════
// COMPARE TAB
// ═══════════════════════════════════════════════════
function renderCompare() {
  const cats = [
    { key:'video',    label:'Video', tools: TOOLS.video },
    { key:'audio',    label:'Audio', tools: TOOLS.audio },
    { key:'subtitle', label:'Subtitles', tools: TOOLS.subtitle },
  ];

  const compareProps = ['Cost','Quality','Python 3.14','No API Key','Offline','GPU needed'];
  const toolProp = (t, prop) => {
    const m = {
      'Cost':       t.cost.split('·')[0].trim().slice(0,20),
      'Quality':    t.rating >= 9 ? '⭐⭐⭐' : t.rating >= 8 ? '⭐⭐' : '⭐',
      'Python 3.14':(!t.local || t.id==='kokoro') ? (t.id==='kokoro'?'❌':'✅') : '✅',
      'No API Key': !t.env_key ? '✅' : '❌',
      'Offline':    t.local ? '✅' : '❌',
      'GPU needed': (t.id==='chatterbox') ? '⚠️' : '❌',
    };
    return m[prop] || '—';
  };

  return cats.map(cat => `
    <div style="margin-bottom:28px;">
      <h3 style="font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;">${cat.label} Tools</h3>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;min-width:600px;">
          <thead>
            <tr>
              <th style="padding:8px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg2);border:1px solid var(--border);text-align:left;width:140px;">Tool</th>
              ${compareProps.map(p=>`<th style="padding:8px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg2);border:1px solid var(--border);text-align:center;">${p}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${cat.tools.map(t => {
              const cfg = isConfigured(t);
              return `<tr style="${cfg?'background:rgba(0,212,170,.04)':''}">
                <td style="padding:8px 12px;border:1px solid var(--border);">
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span>${t.icon}</span>
                    <div>
                      <div style="font-size:12px;font-weight:600;color:var(--text);">${t.name}</div>
                      <div style="font-size:10px;color:${cfg?'var(--teal)':'var(--muted)'};">${cfg?'✓ Ready':'⚠ Not configured'}</div>
                    </div>
                  </div>
                </td>
                ${compareProps.map(p=>`<td style="padding:8px 12px;border:1px solid var(--border);text-align:center;font-size:12px;">${toolProp(t,p)}</td>`).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════
// TRY A TOOL
// ═══════════════════════════════════════════════════
async function tryTool(toolId, cmd) {
  const term = document.getElementById(`term-${toolId}`);
  const body = document.getElementById(`term-body-${toolId}`);
  if (!term || !body) return;
  term.classList.add('open');
  body.innerHTML = '';
  append(body, `$ ${cmd}\n\n`, '#00D4AA');

  try {
    // Parse the command to figure out project/phase/provider
    const parts = cmd.split(/\s+/);
    const script = parts[1];
    const proj   = (cmd.match(/--project\s+(\S+)/)||[])[1] || '';
    const phase  = (cmd.match(/--phase\s+(\d+)/)||[])[1]  || '1';
    const only   = (cmd.match(/--only\s+(\S+)/)||[])[1]   || '';
    const prov   = (cmd.match(/--provider\s+(\S+)/)||[])[1] || '';

    // Check if it's a generate_phase command
    if (script && script.includes('generate_phase')) {
      const data = { project: proj, phase: parseInt(phase), only, provider: prov, topic: '' };
      const res  = await fetch('/api/run-step', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      const { job_id } = await res.json();
      streamJobTo(job_id, body, toolId);
    } else {
      // Generic run
      const data = { project: proj || currentProject, phase: parseInt(phase) || currentPhase,
                     skip_generate: true };
      const res  = await fetch('/api/run', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      const { job_id } = await res.json();
      streamJobTo(job_id, body, toolId);
    }
  } catch(e) {
    append(body, `[ERROR] ${e.message}\n`, 'var(--red)');
  }
}

function streamJobTo(job_id, bodyEl, toolId) {
  const es = new EventSource(`/api/jobs/${job_id}/stream`);
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.ping) return;
    if (d.line) {
      const l = d.line.toLowerCase();
      const c = l.includes('error')||l.includes('fail') ? 'var(--red)' :
                l.includes('ok')||l.includes('pass') ? 'var(--teal)' :
                l.includes('warn') ? 'var(--gold)' : null;
      append(bodyEl, d.line, c);
    }
    if (d.done) {
      es.close();
      const ok = d.status === 'done';
      append(bodyEl, ok ? '\n✅ Done!\n' : '\n❌ Failed\n', ok ? 'var(--teal)' : 'var(--red)');
    }
  };
}

function append(el, text, color) {
  const s = document.createElement('span');
  if (color) s.style.color = color;
  s.textContent = text;
  el.appendChild(s);
  el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════
function switchCat(cat, btn) {
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.cat-panel').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const panel = document.getElementById(`panel-${cat}`);
  if (panel) panel.classList.add('active');
  currentCat = cat;
}

function copyInstall(cmd) {
  navigator.clipboard.writeText(cmd).then(() => showToast('Install command copied!'));
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('DOMContentLoaded', init);
</script>
